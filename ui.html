        return Math.sign((b[0] - a[0]) * (c2[1] - b[1]) - (b[1] - a[1]) * (c2[0] - b[0]));
      };
      for (let m = 0; m + 1 < corners.length; ) {
        const fa = forcedIdx.has(corners[m]), fb = forcedIdx.has(corners[m + 1]);
        if (corners[m + 1] - corners[m] < zMerge && !(fa && fb) &&
            (fa || fb || turnSign(corners[m]) === turnSign(corners[m + 1]))) {
          // a forced apex absorbs its noisy neighbor; two detections average
          corners.splice(m, 2, fa ? corners[m] : fb ? corners[m + 1]
            : Math.round((corners[m] + corners[m + 1]) / 2));
        } else m++;
      }
      for (let m = 0; m < corners.length; m++) {
        const ci = corners[m];
        if (forcedIdx.has(ci)) continue; // the apex coordinate IS the truth
        // tangent arms must stay clear of the NEIGHBORING corner's zone — a
        // tangent measured across the next corner points along the wrong leg
        // and projects the apex far past the true joint
        let gapL, gapR;
        if (closed) {
          gapL = gapR = n;
          if (corners.length > 1) {
            const prev = corners[(m - 1 + corners.length) % corners.length];
            const next = corners[(m + 1) % corners.length];
            gapL = ((ci - prev + n) % n) || n;
            gapR = ((next - ci + n) % n) || n;
          }
        } else {
          gapL = m > 0 ? ci - corners[m - 1] : ci;
          gapR = m < corners.length - 1 ? corners[m + 1] - ci : n - 1 - ci;
        }
        // the rounded zone spans ~0.85x the stroke width (thinning retraction
        // + smoothing), i.e. ~3.4x tol — tangents must clear it, regardless
        // of the (smaller) detection window
        const zBase = Math.max(2, Math.round(tol * 4.25));
        const zL = Math.max(2, Math.min(zBase, Math.floor(gapL * 0.45)));
        const zR = Math.max(2, Math.min(zBase, Math.floor(gapR * 0.45)));
        const armL = Math.min(Math.round(tol * 10), Math.floor(gapL * 0.85));
        const armR = Math.min(Math.round(tol * 10), Math.floor(gapR * 0.85));
        if (armL <= zL || armR <= zR) continue;
        const aIn = pts[idx(ci - armL)], bIn = pts[idx(ci - zL)];
        const aOut = pts[idx(ci + armR)], bOut = pts[idx(ci + zR)];
        let ux = bIn[0] - aIn[0], uy = bIn[1] - aIn[1];
        let vx = bOut[0] - aOut[0], vy = bOut[1] - aOut[1];
        const ul = Math.hypot(ux, uy) || 1, vl = Math.hypot(vx, vy) || 1;
        ux /= ul; uy /= ul; vx /= vl; vy /= vl;
        const det = ux * vy - uy * vx;
        if (Math.abs(det) < 0.25) continue; // near-parallel: no stable apex
        // intersection of (bIn + t*u) and (bOut + s*v)
        const dx = bOut[0] - bIn[0], dy = bOut[1] - bIn[1];
        const t = (dx * vy - dy * vx) / det;
        const apex = [bIn[0] + t * ux, bIn[1] + t * uy];
        const reach = Math.hypot(apex[0] - pts[ci][0], apex[1] - pts[ci][1]);
        if (reach > tol * 6.3) continue; // implausible: keep the measured shape
        // the apex is a CENTERLINE point: the source ink must cover it. An
        // apex probing off the ink means the geometry was misread —
        // rebuilding there would draw an overshoot wedge.
        const mid = [(apex[0] + pts[ci][0]) / 2, (apex[1] + pts[ci][1]) / 2];
        if (!inkOk(apex) || !inkOk(mid)) continue;
        // straighten the rounded zone onto the two legs (u points along the
        // incoming leg toward the corner, v along the path INTO the corner
        // from the outgoing side — walking away from the apex is -u / -v)
        const dIn = Math.hypot(apex[0] - bIn[0], apex[1] - bIn[1]);
        const dOut = Math.hypot(apex[0] - bOut[0], apex[1] - bOut[1]);
        for (let k = 1; k < Math.max(zL, zR); k++) {
          if (k < zL) {
            const f = k / zL;
            pts[idx(ci - k)] = [apex[0] - ux * f * dIn, apex[1] - uy * f * dIn];
          }
          if (k < zR) {
            const f = k / zR;
            pts[idx(ci + k)] = [apex[0] - vx * f * dOut, apex[1] - vy * f * dOut];
          }
        }
        pts[ci] = apex;
      }
    }
    if (cornersOut) {
      // record corner geometry (position + in/out directions) so the
      // caller can probe the source ink for miter vs round joins
      for (const ci of corners) {
        const a = closed ? pts[(ci - w + n) % n] : pts[Math.max(0, ci - w)];
        const b = pts[ci];
        const c2 = closed ? pts[(ci + w) % n] : pts[Math.min(n - 1, ci + w)];
        cornersOut.push({ p: b, u: V.norm(V.sub(b, a)), v: V.norm(V.sub(c2, b)) });
      }
    }

    if (closed) {
      const rs = rectSnap(pts);
      if (rs) return rs;
    }
    if (!closed) {
      if (!corners.length) fitSpan(pts);
      else {
        const cuts = [0, ...corners, n - 1];
        for (let i = 0; i + 1 < cuts.length; i++)
          fitSpan(pts.slice(cuts[i], cuts[i + 1] + 1));
      }
    } else if (corners.length >= 2) {
      for (let i = 0; i < corners.length; i++) {
        const a = corners[i], b = corners[(i + 1) % corners.length];
        fitSpan(a < b ? pts.slice(a, b + 1) : pts.slice(a).concat(pts.slice(0, b + 1)));
      }
    } else if (corners.length === 1) {
      const a = corners[0];
      fitSpan(pts.slice(a).concat(pts.slice(0, a + 1)));
    } else {
      // smooth closed loop: perfect circle/ellipse when it measures as one
      const snapped = ellipseSnap(pts);
      if (snapped) return snapped;
      // otherwise rotate the ring to its top point and fit from there, so
      // the seam anchor sits at an extreme with a horizontal handle
      let top = 0;
      for (let i = 1; i < n; i++) if (pts[i][1] < pts[top][1]) top = i;
      const ww = Math.max(2, Math.min(8, n >> 3));
      const dir = Math.sign(pts[(top + ww) % n][0] - pts[(top - ww + n) % n][0]) || 1;
      const rot = pts.slice(top).concat(pts.slice(0, top), [pts[top]]);
      fitSpan(rot, [dir, 0], [-dir, 0]);
    }
    // corners (detected or rebuilt) and extreme anchors survive cleanup
    const protectedPts = (forcedPts || []).concat(corners.map(ci => pts[ci]), extremePts);
    return axisSnapSegLines(cleanupSegs(segs, tol, SW, closed, protectedPts));
  }

  // Post-cleanup axis snap: a near-vertical/horizontal LINE segment snaps
  // exactly straight, and its endpoints' other occurrences (the corner
  // anchors it shares with neighboring segments) move WITH it. The in-fit
  // snap can't do this — corner anchors are forced points that survive it,
  // which used to leave a leaning bar or a duplicate anchor 0.1u off the
  // snapped seam.
  function axisSnapSegLines(segs) {
    const movePt = (fx, fy, tx2, ty2) => {
      for (const s of segs) {
        const cand = s.line ? s.line : [s[0], s[3]];
        for (const p of cand)
          if ((p[0] - fx) ** 2 + (p[1] - fy) ** 2 < 1) { p[0] = tx2; p[1] = ty2; }
      }
    };
    for (const s of segs) {
      if (!s.line) continue;
      const [a, b] = s.line;
      const chord = Math.hypot(b[0] - a[0], b[1] - a[1]);
      if (chord < 14) continue;
      const gate = Math.max(2, chord * 0.012);
      const dx2 = Math.abs(b[0] - a[0]), dy2 = Math.abs(b[1] - a[1]);
      if (dx2 > 1e-9 && dx2 <= gate && dy2 > dx2) {
        const mx = (a[0] + b[0]) / 2, ay = a[1], by = b[1];
        movePt(a[0], a[1], mx, ay); movePt(b[0], b[1], mx, by);
      } else if (dy2 > 1e-9 && dy2 <= gate && dx2 > dy2) {
        const my = (a[1] + b[1]) / 2, ax = a[0], bx = b[0];
        movePt(a[0], a[1], ax, my); movePt(b[0], b[1], bx, my);
      } else {
        // icon rule: diagonals sit at 45° — snap within ~3.5°, rotating the
        // segment about its midpoint and carrying the shared anchors along
        const ang = Math.atan2(b[1] - a[1], b[0] - a[0]);
        const target = Math.round(ang / (Math.PI / 4)) * (Math.PI / 4);
        const diagonal = Math.abs(Math.abs(target) - Math.PI / 4) < 1e-6 ||
                         Math.abs(Math.abs(target) - 3 * Math.PI / 4) < 1e-6;
        if (diagonal && Math.abs(ang - target) < 0.062) {
          const mx = (a[0] + b[0]) / 2, my = (a[1] + b[1]) / 2, half = chord / 2;
          const na = [mx - Math.cos(target) * half, my - Math.sin(target) * half];
          const nb = [mx + Math.cos(target) * half, my + Math.sin(target) * half];
          movePt(a[0], a[1], na[0], na[1]); movePt(b[0], b[1], nb[0], nb[1]);
        }
      }
    }
    return segs;
  }

  // path data; single points render as dots, smooth chains as fitted curves
  function chainToPathData(chain, smooth, tol, cornersOut, inkCtx) {
    const p = chain.points, n = p.length;
    if (n === 0) return '';
    if (n === 1) return `M ${fmt(p[0][0])} ${fmt(p[0][1])} l 0.01 0`;
    if (smooth && n >= 3) {
      const segs = fitChain(p, !!chain.closed, tol || 1.5, cornersOut, chain.forcedPts, inkCtx, chain.fitW || chain.width);
      if (segs.length) {
        const start = segs[0].line ? segs[0].line[0] : segs[0][0];
        let d = `M ${fmt(start[0])} ${fmt(start[1])}`;
        for (const s of segs) {
          if (s.line) d += ` L ${fmt(s.line[1][0])} ${fmt(s.line[1][1])}`;
          else d += ` C ${fmt(s[1][0])} ${fmt(s[1][1])} ${fmt(s[2][0])} ${fmt(s[2][1])} ${fmt(s[3][0])} ${fmt(s[3][1])}`;
        }
        if (chain.closed) d += ' Z';
        return d;
      }
    }
    let d = `M ${fmt(p[0][0])} ${fmt(p[0][1])}`;
    for (let i = 1; i < n; i++) d += ` L ${fmt(p[i][0])} ${fmt(p[i][1])}`;
    if (chain.closed) d += ' Z';
    return d;
  }

  // Width-scaled polyline smoothing (double box blur ~ Gaussian), applied
  // before curve fitting — the standard vectorization step that removes
  // staircase zigzag from upscaled sources and edge-roughness oscillation.
  // Endpoints stay pinned so junction connections are preserved.
  function smoothChain(points, closed, radius, pins) {
    const n = points.length;
    const r = Math.max(1, Math.min(160, Math.round(radius))); // guard only; callers pass width-relative radii
    if (n < 2 * r + 3) return points;
    // rebuilt corner apexes are exact geometry: the window tapers to zero
    // toward them (like open ends) so the polyline APPROACHES the apex
    // instead of rounding past it — else the forced anchor becomes a spike
    let pinDist = null;
    if (pins && pins.length) {
      pinDist = new Float64Array(n).fill(1e9);
      for (const pi of pins) if (pi >= 0 && pi < n) pinDist[pi] = 0;
      const laps = closed ? 2 : 1;
      for (let l = 0; l < laps; l++) {
        for (let i = 0; i < n; i++) {
          const prev = pinDist[(i - 1 + n) % n];
          if (prev + 1 < pinDist[i]) pinDist[i] = prev + 1;
        }
        for (let i = n - 1; i >= 0; i--) {
          const nxt = pinDist[(i + 1) % n];
          if (nxt + 1 < pinDist[i]) pinDist[i] = nxt + 1;
        }
      }
    }
    let pts = points;
    for (let pass = 0; pass < 2; pass++) {
      const out = new Array(n);
      for (let i = 0; i < n; i++) {
        let rr = r;
        if (!closed) rr = Math.min(r, i, n - 1 - i); // taper at open ends
        if (pinDist) rr = Math.min(rr, pinDist[i]);
        if (rr === 0) { out[i] = pts[i]; continue; }
        let sx = 0, sy = 0, c = 0;
        for (let k = -rr; k <= rr; k++) {
          const j = closed ? ((i + k) % n + n) % n : i + k;
          sx += pts[j][0];
          sy += pts[j][1];
          c++;
        }
        out[i] = [sx / c, sy / c];
      }
      pts = out;
    }
    return pts;
  }

  // Group chains into weight classes. Tight tolerance (25% + 0.6px cushion
  // for quantization at small widths) so every line renders very close to
  // its measured thickness; capped at 6 classes.
  // Re-center polyline points onto the ink midline: scan along each point's
  // normal for the two ink edges and move the point to their midpoint.
  // Corrections are skipped where the ink is wider than the stroke (junction
  // pools, joints) and clamped so a bad probe can't fling a point away.
  function recenterOnInk(pts, closed, width, ink, w, h, avoid) {
    const n = pts.length;
    if (n < 5) return;
    const avoidR2 = (width * 1.2) ** 2;
    const nearAvoid = p => {
      if (!avoid) return false;
      for (const q of avoid)
        if ((p[0] - q[0]) ** 2 + (p[1] - q[1]) ** 2 < avoidR2) return true;
      return false;
    };
    const inkAt = (x, y) => {
      const xi = Math.round(x - 0.5), yi = Math.round(y - 0.5);
      return xi >= 0 && yi >= 0 && xi < w && yi < h && ink[yi * w + xi] === 1;
    };
    const half = width * 0.75, maxShift = Math.max(1, width * 0.3);
    const out = pts.map(p => p);
    const kw = Math.max(2, Math.round(width / 3));
    for (let i = 0; i < n; i++) {
      if (!closed && (i === 0 || i === n - 1)) continue; // ends stay put
      // corners have no meaningful normal — probing across the joint's
      // pooled ink would drag the apex zone sideways and soften the corner
      {
        const a2 = pts[closed ? (i - kw + n) % n : Math.max(0, i - kw)];
        const c2 = pts[closed ? (i + kw) % n : Math.min(n - 1, i + kw)];
        const p2 = pts[i];
        let da = Math.atan2(c2[1] - p2[1], c2[0] - p2[0]) -
                 Math.atan2(p2[1] - a2[1], p2[0] - a2[0]);
        while (da > Math.PI) da -= 2 * Math.PI;
        while (da < -Math.PI) da += 2 * Math.PI;
        if (Math.abs(da) > 0.7) continue;
      }
      const a = pts[closed ? (i - 2 + n) % n : Math.max(0, i - 2)];
      const b = pts[closed ? (i + 2) % n : Math.min(n - 1, i + 2)];
      let nx = -(b[1] - a[1]), ny = b[0] - a[0];
      const nl = Math.hypot(nx, ny);
      if (nl < 1e-6) continue;
      nx /= nl; ny /= nl;
      const p = pts[i];
      if (nearAvoid(p)) continue; // corner wedges: ink median != centerline
      if (!inkAt(p[0], p[1])) continue;
      let tPos = 0, tNeg = 0;
      while (tPos < half && inkAt(p[0] + nx * (tPos + 0.5), p[1] + ny * (tPos + 0.5))) tPos += 0.5;
      while (tNeg > -half && inkAt(p[0] + nx * (tNeg - 0.5), p[1] + ny * (tNeg - 0.5))) tNeg -= 0.5;
      if (tPos >= half || tNeg <= -half) continue; // pooled ink: no clean edges
      let shift = (tPos + tNeg) / 2;
      if (shift > maxShift) shift = maxShift;
      else if (shift < -maxShift) shift = -maxShift;
      out[i] = [p[0] + nx * shift, p[1] + ny * shift];
    }
    for (let i = 0; i < n; i++) pts[i] = out[i];
  }

  function bucketChains(kept) {
    // weight classes are seeded only by chains long enough to measure
    // reliably — a stroke shorter than ~4x its width has no clean interior
    // span (lens-shaped marks, tips), so it INHERITS the nearest class
    // instead of spawning its own from a noisy median. Shortness is judged
    // against the GLOBAL width scale too: an under-measured short stub must
    // not bootstrap itself into "long" via its own too-small width.
    let wmed = 0;
    {
      const arr = kept.filter(c => c.width != null)
        .map(c => [c.width, c.geomLength || 1]).sort((a, b) => a[0] - b[0]);
      const tot = arr.reduce((s, x) => s + x[1], 0);
      let acc = 0;
      for (const [wv, l] of arr) { acc += l; if (acc >= tot / 2) { wmed = wv; break; } }
    }
    // ...but only for JUNCTION-ATTACHED chains: pool ink corrupts exactly
    // those measurements. Free-standing thin marks (stitch dashes next to a
    // fat outline) measure cleanly and are a real thin class of their own.
    const isLong = c => {
      const cw = c.width || 1;
      const attached = c.endDeg && (c.endDeg[0] > 2 || c.endDeg[1] > 2);
      const ref = attached && cw >= wmed * 0.35 ? Math.max(cw, wmed * 0.8) : cw;
      return (c.geomLength != null ? c.geomLength : c.points.length) >= 4 * ref;
    };
    let seeds = kept.filter(isLong);
    if (!seeds.length) seeds = kept.slice();
    const seedSet = new Set(seeds);
    const buckets = [];
    for (const c of seeds.slice().sort((a, b) => a.width - b.width)) {
      const b = buckets[buckets.length - 1];
      if (b && c.width <= b.minW * 1.25 + 0.6) { b.chains.push(c); b.maxW = c.width; }
      else buckets.push({ chains: [c], minW: c.width, maxW: c.width });
    }
    while (buckets.length > 6) {
      let bi = 0, best = Infinity;
      for (let i = 0; i + 1 < buckets.length; i++) {
        const gap = buckets[i + 1].minW / buckets[i].maxW;
        if (gap < best) { best = gap; bi = i; }
      }
      buckets[bi].chains.push(...buckets[bi + 1].chains);
      buckets[bi].maxW = buckets[bi + 1].maxW;
      buckets.splice(bi + 1, 1);
    }
    const weigh = b => {
      let ws = 0, ls = 0;
      for (const c of b.chains) { ws += c.width * c.geomLength; ls += c.geomLength; }
      b.width = ls ? ws / ls : b.minW;
    };
    buckets.forEach(weigh);
    // a split must be genuinely multimodal: merge adjacent classes whose
    // weighted widths sit within ~22% — anti-aliasing alone makes an
    // axis-aligned stroke measure wider than a diagonal of the same weight
    for (let i = 0; i + 1 < buckets.length; ) {
      if (buckets[i + 1].width <= buckets[i].width * 1.22 + 0.6) {
        buckets[i].chains.push(...buckets[i + 1].chains);
        buckets[i].maxW = buckets[i + 1].maxW;
        buckets.splice(i + 1, 1);
        weigh(buckets[i]);
        if (i) i--;
      } else i++;
    }
    for (const c of kept) {
      if (seedSet.has(c)) continue;
      let bb = buckets[0];
      for (const b of buckets)
        if (Math.abs(c.width - b.width) < Math.abs(c.width - bb.width)) bb = b;
      bb.chains.push(c); // class width stays seeded by the long chains
    }
    return buckets;
  }

  // chains -> final SVG. strokeWidth is the desired *average* weight in
  // output px (thickness scaling); per-chain widths stay proportional.
  function buildSvg(chains, w, h, opts) {
    const o = Object.assign({
      simplify: 1, smooth: true, minLength: 4, detail: 1,
      stroke: '#000000', strokeWidth: 2, outW: w, outH: h,
      matchWeights: true, avgWidth: 0
    }, opts || {});
    // detail: fit-tolerance multiplier (<1 keeps more anchors, >1 simplifies)
    const dMul = Math.max(0.1, o.detail || 1);
    const kept = [];
    for (const c of chains) {
      const len = c.geomLength != null ? c.geomLength : c.points.length;
      // effective width: geometry windows scale with the stroke, but a
      // degenerately fat measurement (fused blob) is capped against the
      // drawing's own weight — never against absolute pixels
      const wEff = o.avgWidth > 0 && c.width != null
        ? Math.min(c.width, o.avgWidth * 1.5) : (c.width || 2);
      if (c.filled) {
        // filled-shape outline: no pruning — smoothing and fit tolerance
        // scale with the stroke weight, like everything else
        kept.push({
          closed: true, filled: true,
          points: smoothChain(c.points, true, wEff * 0.4),
          fitTol: Math.max(1.5, wEff * 0.45) * dMul,
          width: c.width, fitW: wEff, geomLength: len
        });
        continue;
      }
      // tiny closed rings (circumference ~ line width) are either skeleton
      // knots at thick junctions (surrounded by ink: drop) or the remnant of
      // a filled dot after upscaling (isolated: keep as a dot)
      if (o.minLength > 0 && c.closed && c.width != null && len < 3.5 * c.width) {
        if (o.ink) {
          let cx = 0, cy = 0;
          for (const p of c.points) { cx += p[0]; cy += p[1]; }
          cx /= c.points.length; cy /= c.points.length;
          const R = len / (2 * Math.PI) + c.width / 2 + 3;
          let hits = 0;
          for (let a = 0; a < 16; a++) {
            const x = Math.round(cx + R * Math.cos(a * Math.PI / 8) - 0.5);
            const y = Math.round(cy + R * Math.sin(a * Math.PI / 8) - 0.5);
            if (x >= 0 && y >= 0 && x < w && y < h && o.ink[y * w + x]) hits++;
          }
          if (hits < 3 && c.width >= Math.max(1, o.minLength)) {
            kept.push({
              closed: false, points: [[cx, cy]],
              width: c.width, geomLength: Math.max(len, 1)
            });
          }
        }
        continue;
      }
      const bothFree = !c.endDeg || (c.endDeg[0] <= 2 && c.endDeg[1] <= 2);
      // roundish isolated blobs (stitch dots): direction is meaningless —
      // render a dot, not a randomly angled tick
      if (!c.closed && bothFree && c.width != null && len < 1.3 * c.width) {
        if (c.width < Math.max(1, o.minLength)) continue; // speckle: dot diameter
        if (c.debris && o.minLength > 0) continue; // fragment shaved off a line
        let cx = 0, cy = 0;
        for (const p of c.points) { cx += p[0]; cy += p[1]; }
        kept.push({
          closed: false,
          points: [[cx / c.points.length, cy / c.points.length]],
          width: c.width, geomLength: Math.max(len, 1)
        });
        continue;
      }
      // disc remnants: a chain no longer than its own widest cross-section,
      // with no other ink around it, is a filled dot (upscaled dots thin
      // into short chains, sometimes with internal junctions)
      if (!c.closed && c.width != null && o.ink &&
          len < (c.maxWidth || c.width) * 1.15 + 2) {
        let cx = 0, cy = 0;
        for (const p of c.points) { cx += p[0]; cy += p[1]; }
        cx /= c.points.length; cy /= c.points.length;
        const R = len / 2 + (c.maxWidth || c.width) / 2 + 3;
        let hits = 0;
        for (let a = 0; a < 16; a++) {
          const x = Math.round(cx + R * Math.cos(a * Math.PI / 8) - 0.5);
          const y = Math.round(cy + R * Math.sin(a * Math.PI / 8) - 0.5);
          if (x >= 0 && y >= 0 && x < w && y < h && o.ink[y * w + x]) hits++;
        }
        if (hits < 3) {
          if ((c.maxWidth || c.width) >= Math.max(1, o.minLength)) {
            kept.push({
              closed: false, points: [[cx, cy]],
              width: c.maxWidth || c.width, geomLength: Math.max(len, 1)
            });
          }
          continue;
        }
      }
      if (c.points.length < Math.max(1, o.minLength)) continue;
      if (o.minLength > 0 && !c.closed && c.endDeg && c.width != null) {
        const a0 = c.endDeg[0] > 2, a1 = c.endDeg[1] > 2;
        if (a0 !== a1) {
          // dead-end hair off a junction. Aggressive pruning only when it
          // hangs off a clearly THICKER line (poke/bridge artifact) — a
          // same-width junction means it's a fragment of the line itself.
          // Caps scale with the junction size: fat strokes grow fat nubs.
          const jw = c.endWidths ? c.endWidths[a0 ? 0 : 1] : c.width;
          // a short stub's own median width is untrustworthy (no clean
          // interior span), but it still separates artifact from feature: a
          // skeleton poke is a thin bump on the parent stroke's flank, while
          // a real feature (a bell's brim tip, a serif) carries close to the
          // drawing's stroke weight even when its tip tapers
          // "clearly exits the junction pool": the pool's radius is jw/2, so
          // full-width ink reaching past ~0.6x jw is a drawn stroke, not a
          // skeleton spur (spurs are thin, or live inside the pool). Fuzz
          // spurs on noisy sources can reach similar lengths, but they stay
          // short relative to the drawing's own stroke weight.
          const realStub = o.avgWidth > 0 &&
            c.width >= o.avgWidth * 0.45 && len > jw * 0.6 &&
            len >= o.avgWidth * 0.85;
          const lim = jw > c.width * 1.6
            ? Math.max(1.5 * c.width, 2.2 * jw)
            : 1.5 * c.width + 2;
          if (!realStub && len < Math.min(Math.max(32, jw * 2.4), lim)) continue;
        } else if (a0 && a1) {
          const ew = c.endWidths || [c.width, c.width];
          // shorter than its two junction blobs combined = lives entirely
          // inside the fused ink, pure skeleton remnant
          if (len < ((ew[0] + 1) / 2 + (ew[1] + 1) / 2) * 0.9) continue;
          const jw = Math.max(ew[0], ew[1]);
          const stubLim = jw > c.width * 1.6
            ? Math.max(20, 2 * jw)          // remnant inside a fat fusion zone
            : Math.min(20, 1.5 * c.width);  // real short connector (H crossbar)
          if (len < stubLim) continue;
        }
      }
      // width-adaptive tolerance: wiggles that are detail on a 2px line are
      // centerline noise on a 14px stroke. Strokes shorter than ~4x their
      // width have no room for width-scaled smoothing or tolerance — both
      // would deform them (a slim arc becomes a bulging comma), so they are
      // fitted conservatively at length-scaled settings instead.
      const isShort = !c.closed && c.width != null && len < 4 * c.width;
      let eps = o.simplify > 0
        ? Math.max(o.simplify, wEff * 0.2) * dMul
        : o.simplify;
      if (isShort && eps > 0) eps = Math.max(0.75, Math.min(eps, len / 8));
      let s;
      if (o.smooth) {
        // smooth the polyline (width-scaled) before fitting, then fit.
        // Reconstructed corner apexes are pinned back to their exact spot —
        // smoothing must not round away corners we deliberately rebuilt.
        const smoothR = Math.min(wEff * 0.4, isShort ? len / 6 : 1e9);
        let pinIdx = null;
        if (c.forced && c.forced.length) {
          pinIdx = [];
          for (const f of c.forced) {
            let bi = -1, bd = 4; // exact members of the polyline (2px slack)
            for (let i = 0; i < c.points.length; i++) {
              const d = (c.points[i][0] - f[0]) ** 2 + (c.points[i][1] - f[1]) ** 2;
              if (d < bd) { bd = d; bi = i; }
            }
            if (bi >= 0) pinIdx.push(bi);
          }
        }
        let pts = smoothChain(c.points, !!c.closed, smoothR, pinIdx);
        // smoothing systematically pulls curves INWARD (shrinkage grows with
        // the width-scaled radius, so thick strokes drift visibly off the
        // ink) — re-center every point on the ink midline along its normal
        if (o.ink && c.width) recenterOnInk(pts, !!c.closed, c.width, o.ink, w, h, c.forced);
        if (c.forced) {
          for (const f of c.forced) {
            let bi = 0, bd = Infinity;
            for (let i = 0; i < pts.length; i++) {
              const d = (pts[i][0] - f[0]) ** 2 + (pts[i][1] - f[1]) ** 2;
              if (d < bd) { bd = d; bi = i; }
            }
            pts[bi] = [f[0], f[1]];
          }
        }
        // corner fusion at any angle: find straight RUNS of the polyline;
        // where two runs meet across a short gap (pool litter, sub-threshold
        // turns the corner detector ignores), the drawn geometry is two
        // straight strokes joined at a corner — replace the gap with the
        // runs' intersection and force ONE anchor there
        let fitForced = c.forced;
        if (pts.length > 8) {
          const latTol = Math.max(1.5, wEff * 0.08);
          const minRun = Math.max(1.2 * wEff, 30); // bold features run ~1.5x width
          const nP = pts.length;
          const devOk = (i, j) => {
            const A2 = pts[i], B2 = pts[j];
            const dx = B2[0] - A2[0], dy = B2[1] - A2[1];
            const L2 = Math.hypot(dx, dy);
            if (L2 < 1) return true;
            const st = Math.max(1, (j - i) >> 5);
            for (let k2 = i + 1; k2 < j; k2 += st) {
              const d = Math.abs(dy * (pts[k2][0] - A2[0]) - dx * (pts[k2][1] - A2[1])) / L2;
              if (d > latTol) return false;
            }
            return true;
          };
          const runs = [];
          let i2 = 0;
          while (i2 < nP - 1) {
            let j2 = i2 + 1, lastGood = -1;
            while (j2 < nP) {
              if (devOk(i2, j2)) { lastGood = j2; if (lastGood === nP - 1) break; j2 = Math.min(nP - 1, j2 + 4); }
              else break;
            }
            const runLen = lastGood > i2
              ? Math.hypot(pts[lastGood][0] - pts[i2][0], pts[lastGood][1] - pts[i2][1]) : 0;
            if (runLen >= minRun) {
              // shave arc tails: refit the line on the middle half, then
              // pull each end in while it strays from that line
              {
                const q4 = (lastGood - i2) >> 2;
                const Am = pts[i2 + q4], Bm = pts[lastGood - q4];
                const dxm = Bm[0] - Am[0], dym = Bm[1] - Am[1];
                const Lm = Math.hypot(dxm, dym);
                if (Lm > 4) {
                  const tolT = Math.max(1.2, wEff * 0.03);
                  const devM = i3 => Math.abs(dym * (pts[i3][0] - Am[0]) - dxm * (pts[i3][1] - Am[1])) / Lm;
                  while (i2 < lastGood - 4 && devM(i2) > tolT) i2++;
                  while (lastGood > i2 + 4 && devM(lastGood) > tolT) lastGood--;
                }
              }
              // CONFIDENT straights only: long enough to be unambiguous, or
              // with an alternating (not one-signed) deviation profile — a
              // shallow arc's chord passes the lateral gate but its sagitta
              // is one-signed, and treating it as a straight polygonizes arcs
              const A2 = pts[i2], B2 = pts[lastGood];
              const dx = B2[0] - A2[0], dy = B2[1] - A2[1];
              let devSum = 0, devN = 0;
              const st = Math.max(1, (lastGood - i2) >> 5);
              for (let k2 = i2 + 1; k2 < lastGood; k2 += st) {
                devSum += (dy * (pts[k2][0] - A2[0]) - dx * (pts[k2][1] - A2[1])) / runLen;
                devN++;
              }
              // the sign gate applies at EVERY length: long chords of a big
              // circle pass any lateral gate, and "long enough" is exactly
              // how arcs polygonize
              // quantization/pool wobble grows with stroke width — the
              // one-signed budget scales with BOTH chord and width
              if (!devN || Math.abs(devSum / devN) <=
                    Math.max(0.6, 0.015 * runLen, 0.012 * wEff))
                runs.push([i2, lastGood]);
              i2 = lastGood;
            } else i2++;
          }
          if (runs.length > 1 || (c.closed && runs.length === 1)) {
            const maxGap = 1.6 * wEff;
            fitForced = (c.forced || []).slice();
            const nearForced = (p, r) =>
              fitForced.some(f => (f[0] - p[0]) ** 2 + (f[1] - p[1]) ** 2 < r * r);
            // a straight run's endpoints are real anchors — but only where
            // the geometry genuinely turns away. A pool interruption or a
            // rebuilt jump CONTINUES the same line; anchoring there sprays
            // anchors mid-straight
            const FORCE_RUN_ENDPOINTS = false; // corpus-hostile: fitter owns straights
            const lineDev = (R, p) => {
              const A3 = pts[R[0]], B3 = pts[R[1]];
              const dx = B3[0] - A3[0], dy = B3[1] - A3[1];
              const L3 = Math.hypot(dx, dy) || 1;
              return Math.abs(dy * (p[0] - A3[0]) - dx * (p[1] - A3[1])) / L3;
            };
            const probePt = (from, step) => {
              const target = 0.8 * wEff;
              let acc = 0, k2 = from, guard2 = nP;
              while (guard2-- > 0) {
                let nx2 = k2 + step;
                if (nx2 < 0 || nx2 >= nP) {
                  if (!c.closed) return null;
                  nx2 = ((nx2 % nP) + nP) % nP;
                }
                const segL = Math.hypot(pts[nx2][0] - pts[k2][0], pts[nx2][1] - pts[k2][1]);
                if (acc + segL >= target) {
                  const f2 = segL > 0 ? (target - acc) / segL : 0;
                  return [pts[k2][0] + (pts[nx2][0] - pts[k2][0]) * f2,
                          pts[k2][1] + (pts[nx2][1] - pts[k2][1]) * f2];
                }
                acc += segL;
                k2 = nx2;
              }
              return null;
            };
            const devLim = Math.max(3, 0.15 * wEff);
            for (const R of (FORCE_RUN_ENDPOINTS ? runs : [])) {
              const pb = probePt(R[0], -1);
              if (pb && lineDev(R, pb) > devLim &&
                  !nearForced(pts[R[0]], wEff * 0.5)) fitForced.push(pts[R[0]]);
              const pf = probePt(R[1], 1);
              if (pf && lineDev(R, pf) > devLim &&
                  !nearForced(pts[R[1]], wEff * 0.5)) fitForced.push(pts[R[1]]);
            }
            const inject = []; // {at: index after which X goes, upto: resume index, X}
            const pairs2 = [];
            for (let m2 = 0; m2 + 1 < runs.length; m2++) pairs2.push([runs[m2], runs[m2 + 1], false]);
            if (c.closed && runs.length > 1) pairs2.push([runs[runs.length - 1], runs[0], true]);
            if (c.closed && runs.length === 1) pairs2.push([runs[0], runs[0], true]);
            for (const [R1, R2, wrap] of pairs2) {
              const e1 = R1[1], s2 = wrap ? R2[0] + nP : R2[0];
              const gapArc = (() => {
                let g = 0;
                for (let k2 = e1; k2 < s2; k2++) {
                  const a2 = pts[k2 % nP], b2 = pts[(k2 + 1) % nP];
                  g += Math.hypot(b2[0] - a2[0], b2[1] - a2[1]);
                }
                return g;
              })();
              if (gapArc > maxGap * 2) continue;
              const q1 = pts[e1], p2j = pts[R2[0]];
              // run directions from the middle half of each run: near the
              // corner a run's last points sag (smoothing pullback), and a
              // chord through the sagged end tilts the measured line — the
              // intersection then lands 0.5-0.8u past the true corner at
              // bold widths (the "pivot past the joint" defect). Short runs
              // (a handful of points) keep the plain endpoint chord.
              const h1 = (e1 - R1[0]) >= 8 ? (e1 - R1[0]) >> 2 : 0;
              const h2 = (R2[1] - R2[0]) >= 8 ? (R2[1] - R2[0]) >> 2 : 0;
              const A1 = pts[R1[0] + h1], B1 = pts[e1 - h1];
              const A2m = pts[R2[0] + h2], B2m = pts[R2[1] - h2];
              let u1x = B1[0] - A1[0], u1y = B1[1] - A1[1];
              let u2x = B2m[0] - A2m[0], u2y = B2m[1] - A2m[1];
              const l1 = Math.hypot(u1x, u1y) || 1, l2 = Math.hypot(u2x, u2y) || 1;
              u1x /= l1; u1y /= l1; u2x /= l2; u2y /= l2;
              const cosT = u1x * u2x + u1y * u2y;
              if (cosT > 0.978 || cosT < -0.26) continue; // 12°..105° turns only
              const det = u1x * u2y - u1y * u2x;
              if (Math.abs(det) < 0.2) continue;
              const dx = A2m[0] - B1[0], dy = A2m[1] - B1[1];
              const t = (dx * u2y - dy * u2x) / det;
              const X = [B1[0] + t * u1x, B1[1] + t * u1y];
              // rounded-corner veto: maxGap scales with stroke width, and at
              // bold weights it grows past the icon's own corner radii — a
              // whole AUTHORED rounded corner then qualifies as a "gap" and
              // gets fused into a fake sharp intersection off the ink. The
              // gap shape alone can't decide (thinning retracts SHARP corners
              // into ~0.5-0.7w arcs too), so the ink decides: a sharp joint's
              // ink (miter or round join) extends >= 0.5w beyond the sharp
              // intersection X along the outer bisector, an authored rounded
              // corner's contour cuts away well short of that. Veto = the gap
              // fits one clean arc AND the outer-apex probe finds background.
              {
                const gp = [];
                const stG = Math.max(1, (s2 - e1) >> 5);
                for (let k2 = e1; k2 <= s2; k2 += stG) gp.push(pts[k2 % nP]);
                if (gp.length >= 5) {
                  let sx = 0, sy = 0, sxx = 0, syy = 0, sxy = 0, sxz = 0, syz = 0, sz = 0;
                  for (const p2 of gp) {
                    const x = p2[0], y = p2[1], z = x * x + y * y;
                    sx += x; sy += y; sxx += x * x; syy += y * y; sxy += x * y;
                    sxz += x * z; syz += y * z; sz += z;
                  }
                  const n3 = gp.length;
                  const det3 = sxx * (syy * n3 - sy * sy) - sxy * (sxy * n3 - sy * sx) + sx * (sxy * sy - syy * sx);
                  if (Math.abs(det3) > 1e-6) {
                    const a3 = (sxz * (syy * n3 - sy * sy) - sxy * (syz * n3 - sy * sz) + sx * (syz * sy - syy * sz)) / det3;
                    const b3 = (sxx * (syz * n3 - sy * sz) - sxz * (sxy * n3 - sy * sx) + sx * (sxy * sz - syz * sx)) / det3;
                    const c3 = (sxx * (syy * sz - syz * sy) - sxy * (sxy * sz - syz * sx) + sxz * (sxy * sy - syy * sx)) / det3;
                    const cx3 = a3 / 2, cy3 = b3 / 2;
                    const r3 = Math.sqrt(Math.max(0, c3 + cx3 * cx3 + cy3 * cy3));
                    let rss = 0;
                    for (const p2 of gp) { const d3 = Math.hypot(p2[0] - cx3, p2[1] - cy3) - r3; rss += d3 * d3; }
                    const rms = Math.sqrt(rss / n3);
                    const sweep = r3 > 0 ? gapArc / r3 : 0;
                    // NOTE a sweep ceiling (≤1.9) was tried instead of the
                    // width-relative radius floor to make thin/bold veto the
                    // same corners — it kills the bottom-edge fix: junction-
                    // carved gaps legitimately sweep 2.5+ rad around a single
                    // corner. The r/wEff floor stays; its cross-weight cost
                    // is ledgered.
                    if (r3 >= 0.55 * wEff && r3 <= 6 * wEff &&
                        rms <= Math.max(2, 0.05 * r3) && sweep >= 0.5) {
                      let apexInked = false;
                      if (o.ink) {
                        const bl = Math.hypot(u1x - u2x, u1y - u2y) || 1;
                        const bx2 = (u1x - u2x) / bl, by2 = (u1y - u2y) / bl;
                        const dP = 0.38 * wEff;
                        let hits = 0, seen = 0;
                        for (const [ox, oy] of [[0, 0], [2, 0], [-2, 0], [0, 2], [0, -2]]) {
                          const xi = Math.round(X[0] + bx2 * dP + ox - 0.5);
                          const yi = Math.round(X[1] + by2 * dP + oy - 0.5);
                          if (xi >= 0 && yi >= 0 && xi < w && yi < h) {
                            seen++;
                            if (o.ink[yi * w + xi]) hits++;
                          }
                        }
                        apexInked = seen > 0 && hits >= seen * 0.5;
                      }
                      // a corner needs two STRAIGHTS. If either flanking run
                      // rides the gap's own circle (a chord-run of a lens
                      // ring or a heart lobe), this is an arc continuation:
                      // neither veto-anchor it (kills the ellipse snap and
                      // flattens lobes) nor fuse it (plants an off-arc X)
                      const runFrac = R => {
                        let on = 0, n5 = 0;
                        const st5 = Math.max(1, (R[1] - R[0]) >> 3);
                        for (let k5 = R[0]; k5 <= R[1]; k5 += st5) {
                          const p5 = pts[k5 % nP];
                          n5++;
                          if (Math.abs(Math.hypot(p5[0] - cx3, p5[1] - cy3) - r3) <= Math.max(2, 0.05 * r3)) on++;
                        }
                        return n5 ? on / n5 : 0;
                      };
                      if (Math.max(runFrac(R1), runFrac(R2)) >= 0.6) continue;
                      if (!apexInked) {
                        // authored rounded corner between straights: never
                        // fuse; anchor the TRUE tangent points — where the
                        // fitted circle touches each run's line (the run ends
                        // themselves creep into the arc by the lateral
                        // tolerance) — exactly where a designer anchors a
                        // rounded corner
                        for (const [P0, ux5, uy5] of [[B1, u1x, u1y], [A2m, u2x, u2y]]) {
                          const tPar = (cx3 - P0[0]) * ux5 + (cy3 - P0[1]) * uy5;
                          const T5 = [P0[0] + tPar * ux5, P0[1] + tPar * uy5];
                          let bi5 = 0, bd5 = Infinity;
                          for (let i5 = 0; i5 < nP; i5++) {
                            const d5 = (pts[i5][0] - T5[0]) ** 2 + (pts[i5][1] - T5[1]) ** 2;
                            if (d5 < bd5) { bd5 = d5; bi5 = i5; }
                          }
                          const tp5 = pts[bi5];
                          if (!nearForced(tp5, wEff * 0.5)) fitForced.push(tp5.slice());
                        }
                        continue;
                      }
                    }
                  }
                }
              }
              if (gapArc > maxGap) continue;
              if (Math.hypot(X[0] - q1[0], X[1] - q1[1]) > 2 * wEff ||
                  Math.hypot(X[0] - p2j[0], X[1] - p2j[1]) > 2 * wEff) continue;
              // a fuse pivot near X is the SAME corner estimated more
              // crudely (probe-slid); X, the intersection of two measured
              // lines, replaces it. An exact match is a duplicate to skip.
              let reloIdx = -1, isDup = false;
              for (let fi = 0; fi < fitForced.length; fi++) {
                const dF = Math.hypot(fitForced[fi][0] - X[0], fitForced[fi][1] - X[1]);
                if (dF < 2) { isDup = true; break; }
                if (dF < wEff * 0.6 && reloIdx < 0) reloIdx = fi;
              }
              if (isDup) continue;
              let stray = 0, vouched = false;
              for (let k2 = e1 + 1; k2 < s2; k2++) {
                const p2 = pts[k2 % nP];
                const d1a = Math.abs(u1y * (p2[0] - q1[0]) - u1x * (p2[1] - q1[1]));
                const d2a = Math.abs(u2y * (p2[0] - p2j[0]) - u2x * (p2[1] - p2j[1]));
                if (Math.min(d1a, d2a) > wEff * 0.28) stray++;
                if (nearForced(p2, wEff * 0.4)) vouched = true;
              }
              if (!stray && !vouched) continue;
              if (reloIdx >= 0) fitForced[reloIdx] = X;
              inject.push({ e1, s2: s2 % nP, X, wrap });
              // the far ends of the fused corner's straight legs keep their
              // anchors — but only where geometry genuinely turns away
              // (mid-straight anchors fragment straights and break grammar)
              for (const [R2b, ei] of [[R1, R1[0]], [R2, R2[1]]]) {
                const pb = probePt(ei, ei === R2b[0] ? -1 : 1);
                if (pb && lineDev(R2b, pb) > Math.max(3, 0.15 * wEff) &&
                    !nearForced(pts[ei], wEff * 0.5)) fitForced.push(pts[ei]);
              }
            }
            if (inject.length) {
              // apply injections on a rotated copy so a seam-crossing gap
              // becomes an ordinary linear one
              const wrapInj = inject.find(ij => ij.wrap) || null;
              const rot = wrapInj ? wrapInj.s2 % nP : 0;
              const rpts = rot ? pts.slice(rot).concat(pts.slice(0, rot)) : pts.slice();
              const mapI = i => ((i - rot) % nP + nP) % nP;
              const linear = inject.map(ij => ({
                e1: mapI(ij.e1), s2: mapI(ij.s2 % nP), X: ij.X
              })).filter(ij => ij.e1 < ij.s2 || ij.s2 === 0)
                .sort((a2, b2) => a2.e1 - b2.e1);
              let out = [];
              let base = 0;
              for (const ij of linear) {
                const stop = ij.s2 === 0 ? nP : ij.s2; // seam gap resumes at 0
                if (ij.e1 < base) continue;             // overlapping: keep first
                out = out.concat(rpts.slice(base, ij.e1 + 1), [ij.X]);
                if (!fitForced.some(f => Math.hypot(f[0] - ij.X[0], f[1] - ij.X[1]) < 2))
                  fitForced.push(ij.X);
                base = stop;
              }
              out = out.concat(rpts.slice(base));
              pts = out;
            }
          }
        }
        s = {
          closed: c.closed,
          points: pts,
          fitTol: Math.max(0.75, eps),
          fitW: wEff,
          forcedPts: fitForced
        };
      } else {
        s = simplifyChain(c, eps);
      }
      s.width = c.width;
      s.geomLength = len;
      s.caps = c.caps;
      s.endDeg = c.endDeg; // weight classing needs to know junction-attachment
      kept.push(s);
    }
    // a split disc can produce several coincident dots — keep one
    for (let i = kept.length - 1; i >= 0; i--) {
      const a = kept[i];
      if (a.points.length !== 1) continue;
      for (let j = 0; j < i; j++) {
        const b = kept[j];
        if (b.points.length !== 1) continue;
        if (Math.hypot(a.points[0][0] - b.points[0][0], a.points[0][1] - b.points[0][1]) <
            Math.max(a.width || 2, b.width || 2)) {
          b.width = Math.max(a.width || 2, b.width || 2);
          kept.splice(i, 1);
          break;
        }
      }
    }
    const toViewBox = w / o.outW;
    // one path per weight class, finished with the cap/join style measured
    // from the source ink (votes across the class's line ends and corners)
    const mkPath = (chainList, outWidth, traceWidth) => {
      const dots = [], lines = [];
      for (const c of chainList) (c.points.length === 1 ? dots : lines).push(c);
      const corners = [];
      const inkCtx = o.ink ? { ink: o.ink, w, h } : null;
      const d = lines.map(c => chainToPathData(c, o.smooth, c.fitTol, corners, inkCtx)).join(' ');
      // per-end cap classification, one entry per subpath in d's order
      // (r=round, b=butt, x=unknown, z=closed) — machine-readable finishing
      const capStr = lines.map(c => c.closed ? 'z:z'
        : ((c.caps && c.caps[0] || 'x')[0]) + ':' + ((c.caps && c.caps[1] || 'x')[0])).join(' ');
      let rc = 0, bc = 0;
      for (const c of chainList) if (c.caps)
        for (const cap of c.caps) {
          if (cap === 'round') rc++;
          else if (cap === 'butt') bc++;
        }
      let mj = 0, rj = 0;
      if (o.ink) {
        const wHalf = (traceWidth || 2) / 2;
        const runFrom = (p, dir) => { // ink run length along a direction
          const maxR = wHalf * 3 + 4;
          let r = 0;
          while (r < maxR) { // half-pixel steps: small strokes need the resolution
            const x = Math.round(p[0] + dir[0] * (r + 0.5) - 0.5);
            const y = Math.round(p[1] + dir[1] * (r + 0.5) - 0.5);
            if (x < 0 || y < 0 || x >= w || y >= h || !o.ink[y * w + x]) break;
            r += 0.5;
          }
          return r;
        };
        const rot = (d, a) => [d[0] * Math.cos(a) - d[1] * Math.sin(a),
                               d[0] * Math.sin(a) + d[1] * Math.cos(a)];
        for (const cr of corners) {
          // a miter tip juts out along the outer bisector to (w/2)/cos(t/2)
          // for a turn of t, while a round join stops at w/2 in every
          // outward direction — measure the bisector run and compare it to
          // both expectations. (Side-run ratios fail on exact corners: probes
          // slightly off the bisector graze along the legs' own ink. And the
          // INNER bisector always reaches the joint's square inner corner,
          // sharp pen or round — never take the longer of the two runs.)
          // u - v points to the convex side for either winding direction.
          // Start the probe a little INSIDE the joint: the corner anchor can
          // sit a fraction of a pixel off the ink and clip the run.
          const bis = V.norm(V.sub(cr.u, cr.v));
          const back = Math.max(1.5, wHalf * 0.5);
          const rBis = runFrom([cr.p[0] - bis[0] * back, cr.p[1] - bis[1] * back], bis) - back;
          const cosHalf = Math.sqrt(Math.max(0.05, (1 + V.dot(cr.u, cr.v)) / 2));
          const tip = wHalf / cosHalf;
          // a run far below the round-join radius means the probe started at
          // a junction pool or off the ink — abstain instead of voting round
          if (rBis < wHalf * 0.6) continue;
          // shallow turns barely separate round from miter — abstain
          if (tip - wHalf < Math.max(2, wHalf * 0.22)) continue;
          // both legs must be CLEAN single strokes near the corner: two
          // strokes converging at a shallow angle fuse into a solid wedge
          // whose ink reads like a miter tip
          const armClean = dir => {
            const q = [cr.p[0] + dir[0] * wHalf * 2, cr.p[1] + dir[1] * wHalf * 2];
            const pu = [-dir[1], dir[0]];
            return runFrom(q, pu) + runFrom(q, [-pu[0], -pu[1]]) < wHalf * 3;
          };
          if (!armClean([-cr.u[0], -cr.u[1]]) || !armClean([cr.v[0], cr.v[1]])) continue;
          // pixel quantization clips diagonal runs by ~0.7px, so the gate
          // sits well below the geometric midpoint between round and miter
          if (rBis > wHalf + (tip - wHalf) * 0.3) mj++;
          else rj++;
        }
      }
      return {
        d,
        capStr,
        dotD: dots.map(c => chainToPathData(c, o.smooth, c.fitTol)).join(' '),
        width: outWidth,
        cap: bc > rc ? 'butt' : 'round',
        join: mj > rj ? 'miter' : 'round'
      };
    };
    const fills = kept.filter(c => c.filled);
    const strokesOnly = kept.filter(c => !c.filled);
    let paths;
    if (o.matchWeights && o.avgWidth > 0 && strokesOnly.length && strokesOnly.every(c => c.width != null)) {
      paths = bucketChains(strokesOnly).sort((a, b) => b.width - a.width)
        // x1.03: the 3-4 chamfer distance transform under-measures stroke
        // width by ~3% averaged over edge orientations — corrected here,
        // where MEASURED widths become rendered ones (explicit strokeWidth
        // requests stay untouched)
        .map(b => mkPath(b.chains, b.width / o.avgWidth * o.strokeWidth * 1.03, b.width));
    } else {
      paths = strokesOnly.length ? [mkPath(strokesOnly, o.strokeWidth, o.avgWidth || 2)] : [];
    }
    // solid shapes render as filled outlines, not strokes
    if (fills.length) {
      paths.push({
        d: fills.map(c => chainToPathData(c, o.smooth, c.fitTol)).join(' '),
        dotD: '', width: 0, cap: 'round', join: 'round', filled: true
      });
    }
    const body = paths.map(p => {
      if (p.filled) return `<path d="${p.d}" fill="${o.stroke}" stroke="none"/>`;
      const sw = fmt(Math.max(0.05, p.width * toViewBox));
      let out = '';
      if (p.d) out += `<path d="${p.d}" fill="none" stroke="${o.stroke}" stroke-width="${sw}" ` +
        `stroke-linecap="${p.cap}" stroke-linejoin="${p.join}" data-caps="${p.capStr || ''}"/>`;
      // dots need round caps to render, whatever the class voted
      if (p.dotD) out += `<path d="${p.dotD}" fill="none" stroke="${o.stroke}" stroke-width="${sw}" ` +
        `stroke-linecap="round" stroke-linejoin="round"/>`;
      return out;
    }).join('');
    const svg =
      `<svg xmlns="http://www.w3.org/2000/svg" width="${fmt(o.outW)}" height="${fmt(o.outH)}" ` +
      `viewBox="0 0 ${w} ${h}">${body}</svg>`;
    return {
      svg,
      pathCount: kept.length,
      // anchor points in the final geometry (M/C/L commands), not raw samples
      pointCount: paths.reduce((s, p) =>
        s + (p.d.match(/[MCL]/g) || []).length + (p.dotD.match(/M/g) || []).length, 0),
      weights: paths.filter(p => !p.filled).map(p => Math.round(p.width * 100) / 100)
    };
  }

  // Full automatic pipeline: image -> merged, measured chains + the values
  // needed to reproduce the source look (average weight, ink color).
  function trace(img, opts) {
    const o = opts || {};
    progress(0.04, 'analyzing');
    const auto = analyze(img);
    let mode = !o.mode || o.mode === 'auto' ? auto.mode : o.mode;
    if (o.invert && mode !== 'alpha') mode = mode === 'dark' ? 'light' : 'dark';
    const warnings = [];
    let threshold, bin, skel, preprocess = 'none', sharpenApplied = 0, tuning = null;
    let blurGrade = 'soft'; // manual-threshold path: keep bridging permissive
    if (o.threshold != null) {
      threshold = o.threshold;
      bin = fillHoles(binarize(img, threshold, mode), img.width, img.height);
      skel = thin(bin, img.width, img.height);
    } else {
      // Two things are auto-tuned by skeleton-topology score (long skeleton,
      // few junctions = fused lines, few endpoints = broken lines):
      //  - the ink threshold (Otsu alone fuses nearly-touching lines), and
      //  - whether to denoise first (blur before binarizing cleans rough
      //    low-quality sources but would fuse crisp fine detail — so it
      //    only wins when the measured topology says it helps).
      const ladder = base => {
        const strictness = f => mode === 'dark'
          ? Math.round(base * f)
          : Math.round(255 - (255 - base) * f);
        return mode === 'alpha'
          ? [base]
          : [...new Set([1, 0.85, 0.7, 0.55].map(f =>
              Math.max(15, Math.min(254, strictness(f)))))];
      };
      // rank candidates on a half-scale proxy (thinning is the hot path and
      // the topology ORDERING is preserved), then thin only the winner at
      // full resolution
      // NOTE: the whole variant competition is tuned at THIS proxy
      // resolution — changing the cutoff or filter reshuffles which
      // candidates win across every scenario (dense hatching trades a
      // little coverage for it; see test 37's bounds)
      let proxy = img;
      if (img.width * img.height > 700 * 700) {
        const pw = img.width >> 1, ph = img.height >> 1;
        const pd = new Uint8ClampedArray(pw * ph * 4);
        for (let y = 0; y < ph; y++) {
          for (let x = 0; x < pw; x++) {
            const s0 = (y * 2 * img.width + x * 2) * 4;
            const s1 = s0 + 4, s2 = s0 + img.width * 4, s3 = s2 + 4;
            const d = (y * pw + x) * 4;
            for (let ch = 0; ch < 4; ch++)
              pd[d + ch] = (img.data[s0 + ch] + img.data[s1 + ch] + img.data[s2 + ch] + img.data[s3 + ch]) / 4;
          }
        }
        proxy = { width: pw, height: ph, data: pd };
      }
      // score = skeleton topology minus an ink-fraction sanity penalty
      // (topology alone can't see that a candidate "traced" the background)
      const totalPx = proxy.width * proxy.height;
      const scoreBin = raw => {
        const b = fillHoles(raw, proxy.width, proxy.height);
        const s = thin(b, proxy.width, proxy.height);
        const st = topoStats(s, proxy.width, proxy.height);
        let inkN = 0;
        for (let i = 0; i < b.length; i++) inkN += b[i];
        return { topo: st.score, inkN };
      };
      progress(0.1, 'tuning threshold');
      const blurInfo = measureBlur(proxy, o.srcScale);
      blurGrade = blurInfo.grade;
      const shAmt = o.sharpen === 0 ? 0
        : (typeof o.sharpen === 'number' ? o.sharpen
        : (blurInfo.grade !== 'sharp' ? 1.6 : 0));
      const cands = [];
      const half = arr => arr.filter((_, i) => i % 2 === 0);
      for (const t of ladder(auto.threshold))
        cands.push({ key: 'none', t, ...scoreBin(binarize(proxy, t, mode)) });
      const proxBlur = boxBlurRGBA(proxy, proxy === img ? 2 : 1);
      for (const t of half(ladder(analyze(proxBlur).threshold)))
        cands.push({ key: 'blur', t, ...scoreBin(binarize(proxBlur, t, mode)) });
      const sharpRadius = blurInfo.grade === 'severe'
        ? Math.round(Math.min(proxy.width, proxy.height) / 70)
        : Math.round(Math.min(proxy.width, proxy.height) / 130);
      if (shAmt > 0 && mode !== 'alpha') {
        // unsharp mask restores edge contrast on soft/blurry sources —
        // radius scales with how blurred the image measured
        const pSharp = unsharp(proxy, Math.max(2, sharpRadius), shAmt);
        for (const t of ladder(analyze(pSharp).threshold))
          cands.push({ key: 'sharp', t, ...scoreBin(binarize(pSharp, t, mode)) });
      }
      if (mode !== 'alpha') {
        // background flattening + Sauvola + hysteresis: the answer to uneven
        // lighting and shadows that no global threshold can pass
        cands.push({ key: 'adaptive', t: auto.threshold,
          ...scoreBin(sauvolaBin(flattenBg(proxy), mode, o.thresholdOffset || 0)) });
      }
      // ink economy (same structure captured with less ink = more faithful;
      // a blur/sharpen halo is fat, the true stroke core lean) applies WITHIN
      // each preprocessed variant's ladder and between the finalists — but
      // NOT within the raw ladder: there it would reward ever-stricter
      // thresholds for eroding legitimate dots and thinning strokes.
      const econPick = arr => {
        let mi = Infinity;
        for (const c of arr) if (c.inkN > totalPx * 0.002) mi = Math.min(mi, c.inkN);
        if (!isFinite(mi)) mi = 0;
        let b = null;
        for (const c of arr) {
          c.score = c.topo - Math.max(0, c.inkN - mi) * 0.05;
          if (!b || c.score > b.score) b = c;
        }
        return b;
      };
      let bestNone = null;
      for (const c of cands)
        if (c.key === 'none' && (!bestNone || c.topo > bestNone.topo)) bestNone = c;
      const bestOther = econPick(cands.filter(c => c.key !== 'none'));
      const finalists = [bestNone, bestOther].filter(Boolean);
      let minInk = Infinity;
      for (const c of finalists) if (c.inkN > totalPx * 0.002) minInk = Math.min(minInk, c.inkN);
      if (!isFinite(minInk)) minInk = 0;
      for (const c of finalists) c.score = c.topo - Math.max(0, c.inkN - minInk) * 0.05;
      // fidelity bias: preprocessing must win DECISIVELY on SHARP images
      // (protecting crisp fine detail and clean icon renders) — on
      // measured-blurry images the remediation is expected to win, so the
      // bar drops
      const gate = s => blurInfo.grade === 'sharp' ? s * 1.3 + 120 : s * 0.85;
      const best = bestOther && (!bestNone || bestOther.score > gate(bestNone.score))
        ? bestOther : bestNone;
      trace.lastTuning = { cands, best };
      tuning = {
        grade: blurInfo.grade, p95: blurInfo.p95,
        noneScore: bestNone ? Math.round(bestNone.score) : null,
        altKey: bestOther ? bestOther.key : null,
        altScore: bestOther ? Math.round(bestOther.score) : null
      };
      preprocess = best.key;
      if (best.key === 'sharp') sharpenApplied = shAmt;
      if (blurInfo.grade === 'severe')
        warnings.push('Image is very blurry — result may need cleanup; a sharper source is recommended.');
      // a photo tell: the RAW image has no line structure at any threshold
      // (negative topology score) and only preprocessing "found" some —
      // sharpening a photo manufactures traceable texture edges
      if (best.score <= 0 || (bestNone && bestNone.score <= 0 && best !== bestNone))
        warnings.push('No clear line structure found — this may be a photo or continuous-tone image; the trace may not be meaningful.');
      const off = o.thresholdOffset || 0;
      if (best.key === 'adaptive') {
        threshold = best.t;
        bin = fillHoles(sauvolaBin(flattenBg(img), mode, off), img.width, img.height);
      } else {
        let srcImg = img;
        if (best.key === 'blur') srcImg = boxBlurRGBA(img, 2);
        else if (best.key === 'sharp')
          srcImg = unsharp(img, Math.max(2, blurInfo.grade === 'severe'
            ? Math.round(Math.min(img.width, img.height) / 70)
            : Math.round(Math.min(img.width, img.height) / 130)), shAmt);
        threshold = Math.max(1, Math.min(254, best.t + (mode === 'light' ? -off : off)));
        bin = fillHoles(binarize(srcImg, threshold, mode), img.width, img.height);
      }
      progress(0.4, 'thinning');
      skel = thin(bin, img.width, img.height);
    }
    progress(0.62, 'tracing lines');
    let chains = extractChains(skel, img.width, img.height);

    const dist = distanceTransform(bin, img.width, img.height);
    for (const c of chains) {
      const raw = [], cum = [0];
      let glen = 0, maxS = 0;
      for (let k = 0; k < c.points.length; k++) {
        const p = c.points[k];
        const s = dist[(p[1] - 0.5) * img.width + (p[0] - 0.5)];
        raw.push(s);
        if (s > maxS) maxS = s;
        if (k) {
          glen += Math.hypot(p[0] - c.points[k - 1][0], p[1] - c.points[k - 1][1]);
          cum.push(glen);
        }
      }
      const med = a => { const s = a.slice().sort((x, y) => x - y); return s[s.length >> 1]; };
      const first = raw[0], last = raw[raw.length - 1];
      // internal widths keep the raw chamfer scale (every geometry gate is
      // tuned against it); the ~3% chamfer under-measurement is compensated
      // at RENDER time (W_CAL in buildSvg)
      const DSC = 3;
      c._pw = raw.map(s => Math.max(1, 2 * s / DSC - 1)); // per-point widths
      // the line's own width comes from clean INTERIOR spans only: ink pools
      // at junctions, corners and caps and inflates the distance transform,
      // while tapering tips deflate it — both bias a whole-chain median
      const allMed = med(raw);
      let base = raw;
      if (!c.closed) {
        const marginPx = 1.5 * Math.max(1, 2 * allMed / DSC - 1); // ~1.5x width
        const interior = [];
        for (let k = 0; k < raw.length; k++)
          if (cum[k] >= marginPx && glen - cum[k] >= marginPx) interior.push(raw[k]);
        if (interior.length >= 5) base = interior;
      }
      let mRad = med(base);
      { // clip pooled outliers (interior corners/crossovers), re-take median
        const pool = [];
        for (const s of base) if (s <= mRad * 1.25) pool.push(s);
        if (pool.length >= 5 && pool.length >= base.length * 0.6) mRad = med(pool);
      }
      c.width = Math.max(1, 2 * mRad / DSC - 1);
      // max width: a filled dot's chain is as "wide" as it is long at its
      // center, unlike a line — used to recognize disc remnants
      c.maxWidth = Math.max(1, 2 * maxS / DSC - 1);
      c.endWidths = [Math.max(1, 2 * first / DSC - 1), Math.max(1, 2 * last / DSC - 1)];
      c.geomLength = glen;
    }

    // ---- filled shapes (arrowheads, solid dots, badges) ----
    // Icons mix strokes with SOLID shapes. A region much fatter than the
    // stroke weight is a fill, not a line — its skeleton "spine" is
    // meaningless. Carve such regions out and trace their OUTLINE instead,
    // to be emitted as filled polygons with sharp corners.
    let strokeWmed = 2;
    {
      const W = img.width, Hh = img.height;
      // length-weighted median width: real strokes dominate total length,
      // so the fat (short) spines of filled shapes can't inflate it
      const sw = chains.filter(c => c.points.length > 2)
        .map(c => ({ w: c.width, l: c.geomLength || c.points.length }))
        .sort((a, b) => a.w - b.w);
      let totL = 0;
      for (const e of sw) totL += e.l;
      let accL = 0, strokeW = 2;
      for (const e of sw) {
        accL += e.l;
        if (accL >= totL / 2) { strokeW = e.w; break; }
      }
      strokeWmed = strokeW;
      const coreR = Math.max(2.5, strokeW * 0.95);
      const seenC = new Uint8Array(W * Hh);
      const regionAll = new Uint8Array(W * Hh);
      const stack = [];
      const filled = [];
      for (let i0 = 0; i0 < W * Hh; i0++) {
        if (seenC[i0] || dist[i0] / 3 < coreR) continue;
        const comp = [];
        seenC[i0] = 1;
        stack.push(i0);
        let minX = 1e9, maxX = -1, minY = 1e9, maxY = -1, maxD = 0;
        while (stack.length) {
          const i = stack.pop();
          comp.push(i);
          const x = i % W, y = (i / W) | 0;
          if (dist[i] > maxD) maxD = dist[i];
          if (x < minX) minX = x;
          if (x > maxX) maxX = x;
          if (y < minY) minY = y;
          if (y > maxY) maxY = y;
          const nbs = [x > 0 ? i - 1 : -1, x < W - 1 ? i + 1 : -1, y > 0 ? i - W : -1, y < Hh - 1 ? i + W : -1];
          for (const nb of nbs)
            if (nb >= 0 && !seenC[nb] && dist[nb] / 3 >= coreR) { seenC[nb] = 1; stack.push(nb); }
        }
        const thick = (2 * maxD) / 3;
        if (comp.length < coreR * coreR * 1.5) continue; // speck
        // elongated fat = just a thick line (renders identically as stroke)
        if (Math.max(maxX - minX, maxY - minY) > 3.2 * thick) continue;
        // grow the core back out to the ink boundary (the fattest point of
        // the blob dictates how far the boundary can be from the core)
        const K = Math.ceil(maxD / 3) + 2;
        let frontier = comp;
        for (const i of comp) regionAll[i] = 1;
        const region = new Set(comp);
        for (let step = 0; step < K && frontier.length; step++) {
          const nxt = [];
          for (const i of frontier) {
            const x = i % W, y = (i / W) | 0;
            const nbs = [x > 0 ? i - 1 : -1, x < W - 1 ? i + 1 : -1, y > 0 ? i - W : -1, y < Hh - 1 ? i + W : -1];
            for (const nb of nbs)
              if (nb >= 0 && bin[nb] && !regionAll[nb]) { regionAll[nb] = 1; region.add(nb); nxt.push(nb); }
          }
          frontier = nxt;
        }
        // junction guard: a genuine fill has at most ONE stroke attached;
        // several strokes passing through means this is a fused crossing
        let passers = 0;
        for (const c of chains) {
          let inside = 0;
          for (const p of c.points)
            if (regionAll[(p[1] - 0.5) * W + (p[0] - 0.5)]) inside++;
          if (inside > 0 && inside / c.points.length < 0.7) passers++;
        }
        if (passers >= 2) {
          for (const i of region) regionAll[i] = 0;
          continue;
        }
        // Moore-neighbor boundary trace of the region
        let start = -1;
        for (const i of region) if (start < 0 || i < start) start = i;
        const dxs = [1, 1, 0, -1, -1, -1, 0, 1], dys = [0, 1, 1, 1, 0, -1, -1, -1];
        const inR = (x, y) => x >= 0 && y >= 0 && x < W && y < Hh && regionAll[y * W + x];
        const pts = [];
        let cx = start % W, cy = (start / W) | 0, back = 4;
        let guard = 8 * region.size + 64;
        const sx = cx, sy = cy;
        while (guard-- > 0) {
          pts.push([cx + 0.5, cy + 0.5]);
          let d = -1;
          for (let k = 0; k < 8; k++) {
            const cand = (back + 1 + k) % 8;
            if (inR(cx + dxs[cand], cy + dys[cand])) { d = cand; break; }
          }
          if (d < 0) break; // isolated pixel
          cx += dxs[d];
          cy += dys[d];
          back = (d + 4) % 8;
          if (cx === sx && cy === sy) break;
        }
        if (pts.length >= 12) {
          let per = 0;
          for (let i = 1; i < pts.length; i++)
            per += Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]);
          filled.push({
            closed: true, filled: true, points: pts,
            width: strokeW, geomLength: per, endDeg: [2, 2]
          });
        }
      }
      if (filled.length) {
        // drop skeleton spines living inside carved regions
        chains = chains.filter(c => {
          let inside = 0;
          for (const p of c.points)
            if (regionAll[(p[1] - 0.5) * W + (p[0] - 0.5)]) inside++;
          return inside / c.points.length < 0.7;
        });
        chains.push(...filled);
      }
    }

    // Intra-cap medial-axis debris: thick flat (butt) caps grow skeleton
    // branches INSIDE the cap disc; at bold widths they survive as tiny
    // chains that bend the parent's end during merging. A chain that fits
    // entirely inside another chain's end-cap disc is cap debris.
    {
      const ends2 = [];
      for (const c of chains) {
        if (c.closed || c.points.length < 2 || !c.endDeg) continue;
        for (const e of [0, 1])
          if (c.endDeg[e] <= 1)
            ends2.push({ p: e === 0 ? c.points[0] : c.points[c.points.length - 1],
                         w: c.width || 2, c });
      }
      let fbDeleted = 0;
      // face-branch removal: a flat (butt) face of a THICK stroke grows the
      // face's own medial branch, so the stroke's end junction is populated
      // ONLY by short free-tailed slivers (the branch halves). Delete them.
      // A real junction always holds at least one other substantial arm —
      // including the corner-tip spurs the merge machinery needs.
      {
        const del = new Set();
        const fbEnds = []; // parent ends whose pool was emptied
        for (const c of chains) {
          if (c.closed || c.points.length < 2 || !c.endDeg) continue;
          const cw = c.width || 2;
          // the parent must be a real stroke: long, OR a short piece spanning
          // two junctions (a stroke's tail between a crossing and its own
          // butt face — its face slivers must still be cleaned)
          const cLen = c.geomLength || c.points.length;
          const spansJoints = c.endDeg[0] > 2 && c.endDeg[1] > 2;
          if (cLen < cw * 2 && !spansJoints) continue;
          for (const e of [0, 1]) {
            if (c.endDeg[e] < 3) continue;
            const pE = e === 0 ? c.points[0] : c.points[c.points.length - 1];
            const rr = Math.max(6, cw * 0.6);
            const near = [];
            let real = false;
            for (const o of chains) {
              if (o === c) continue;
              if (o.closed) {
                // a ring passing THROUGH the joint is a substantial arm (a
                // stroke crossing a square's edge): skipping rings here
                // deleted every short stub beyond such a crossing
                const st = Math.max(1, o.points.length >> 6);
                for (let i = 0; i < o.points.length; i += st)
                  if (Math.hypot(o.points[i][0] - pE[0], o.points[i][1] - pE[1]) < rr) { real = true; break; }
                if (real) break;
                continue;
              }
              let touches = false;
              for (const oe of [0, 1]) {
                const p2 = oe === 0 ? o.points[0] : o.points[o.points.length - 1];
                if (Math.hypot(p2[0] - pE[0], p2[1] - pE[1]) < rr) { touches = true; break; }
              }
              if (!touches) continue;
              const oLen = o.geomLength || o.points.length;
              const oFree = o.endDeg && (o.endDeg[0] <= 1 || o.endDeg[1] <= 1);
              // a face-branch sliver is the face's own medial axis inside the
              // cap: short AND thin (its ink radius tapers toward the face
              // corners). A short arm of FULL width is a real stroke —
              // arrowhead barbs and crossing stubs are only ~1w long, and a
              // plain length gate ate them
              // a face-branch sliver is the face's own medial axis: ~0.5-0.7w
              // long. A free arm of >= 1w is a real stroke — at bold weights
              // arrowhead barbs retract to ~1.3w and a 1.6w gate deleted them
              if (oLen < cw * 1.0 && oFree) near.push(o);
              else real = true;
            }
            if (!real && near.length) {
              for (const o of near) del.add(o);
              // only a FACE empties into a free butt end: a flat face grows
              // two branch halves. A lone sliver is a corner-tip spur whose
              // corner the join machinery still owns — keep that end
              // junction-attached (resetting it broke every mouth corner)
              if (near.length >= 2) fbEnds.push({ c, e, pE, rr });
            }
          }
        }
        if (del.size) {
          chains = chains.filter(c => !del.has(c));
          fbDeleted = del.size;
          // a parent end whose pool held ONLY slivers is now a free butt end:
          // leaving it junction-attached (stale degree) lets the corner-join
          // pass weld it to whatever other end sits a width away
          for (const fe of fbEnds) {
            let stillJoint = false;
            for (const o of chains) {
              if (o === fe.c) continue;
              if (o.closed) {
                const st = Math.max(1, o.points.length >> 6);
                for (let i = 0; i < o.points.length; i += st)
                  if (Math.hypot(o.points[i][0] - fe.pE[0], o.points[i][1] - fe.pE[1]) < fe.rr) { stillJoint = true; break; }
              } else {
                for (const p2 of [o.points[0], o.points[o.points.length - 1]])
                  if (Math.hypot(p2[0] - fe.pE[0], p2[1] - fe.pE[1]) < fe.rr) { stillJoint = true; break; }
              }
              if (stillJoint) break;
            }
            if (!stillJoint) {
              fe.c.endDeg[fe.e] = 1;
              if (fe.c.trim) fe.c.trim[fe.e] = null;
            }
          }
        }
      }
      const keep = [];
      for (const c of chains) {
        const len = c.geomLength || c.points.length;
        let debris = false;
        if (!c.closed && len < (c.width || 2) * 1.6) {
          for (const E of ends2) {
            if (E.c === c) continue;
            if (len > E.w * 1.4) continue;
            const rr = E.w * 0.8;
            let inside = true;
            for (const p of c.points)
              if (Math.hypot(p[0] - E.p[0], p[1] - E.p[1]) > rr) { inside = false; break; }
            if (inside) { debris = true; break; }
          }
        }
        if (!debris) keep.push(c);
      }
      const dropped = chains.length - keep.length + fbDeleted;
      chains = keep;
      if (dropped) {
        for (const c of chains) {
          if (c.closed || !c.endDeg) continue;
          for (const e of [0, 1]) {
            if (c.endDeg[e] <= 1) continue;
            const tr = c.trim && c.trim[e];
            const p = tr ? tr.p : (e === 0 ? c.points[0] : c.points[c.points.length - 1]);
            const rr = Math.max(6, (tr ? tr.r : (c.width || 2) * 0.5) * 1.2);
            let occupied = false;
            for (const o of chains) {
              if (o === c) continue;
              const pts = o.points;
              for (let k = 0; k < pts.length && !occupied; k += 4)
                if (Math.hypot(pts[k][0] - p[0], pts[k][1] - p[1]) < rr) occupied = true;
              if (occupied) break;
            }
            if (!occupied) { c.endDeg[e] = 1; if (c.trim) c.trim[e] = null; }
          }
        }
      }
    }

    // Trim chain ends back out of junction blobs: where strokes cross, the
    // ink is locally much wider and the skeleton wanders, bending every
    // line entering the junction. Each trimmed end remembers the junction
    // point so merging can bridge through it cleanly.
    for (const c of chains) {
      if (c.closed || !c.endDeg) { delete c._pw; continue; }
      c.trim = [null, null];
      for (const e of [0, 1]) {
        if (c.endDeg[e] <= 2 || c.points.length < 6) continue;
        const jr = ((c.endWidths ? c.endWidths[e] : c.width) + 1) / 2;
        const minTrim = jr * 1.15;
        if (c.geomLength < minTrim * 2.5) continue;
        // keep trimming while the ink is still fused (wider than the line
        // itself) — tangential merges fuse far beyond the junction radius
        const wLimit = Math.max(c.width * 1.35, c.width + 2);
        const maxTrim = Math.min(c.geomLength * 0.35, jr * 8);
        const jp = e === 0 ? c.points[0] : c.points[c.points.length - 1];
        let acc = 0, cut = 0, clear = 0;
        const n = c.points.length;
        while (cut + 3 < n && acc < maxTrim) {
          const i = e === 0 ? cut : n - 1 - cut;
          if (acc >= minTrim && c._pw[i] <= wLimit) {
            if (++clear >= 3) break;
          } else clear = 0;
          const a = e === 0 ? c.points[cut] : c.points[n - 1 - cut];
          const b = e === 0 ? c.points[cut + 1] : c.points[n - 2 - cut];
          acc += Math.hypot(b[0] - a[0], b[1] - a[1]);
          cut++;
        }
        cut = Math.max(0, cut - clear);
        if (!cut) continue;
        if (e === 0) {
          c.points = c.points.slice(cut);
          c._pw = c._pw.slice(cut);
        } else {
          c.points = c.points.slice(0, c.points.length - cut);
          c._pw = c._pw.slice(0, c._pw.length - cut);
        }
        c.geomLength = Math.max(1, c.geomLength - acc);
        c.trim[e] = { p: jp, r: jr };
      }
      delete c._pw;
    }

    // Tiny isolated chains: measure the ink's own extent by ray-casting.
    // A short thick tick can collapse to a single skeleton pixel — if its
    // ink is clearly elongated, rebuild it as a line along its axis. Then
    // check a ring BEYOND the own ink: other ink nearby = debris fragment.
    for (const c of chains) {
      if (c.closed || c.geomLength >= 1.3 * c.width) continue;
      if (c.endDeg && (c.endDeg[0] > 2 || c.endDeg[1] > 2)) continue;
      let cx = 0, cy = 0;
      for (const p of c.points) { cx += p[0]; cy += p[1]; }
      cx /= c.points.length; cy /= c.points.length;
      const rayMax = Math.max(80, 3 * (c.width || 2));
      const ray = (dx, dy) => {
        let r = 0;
        while (r < rayMax) {
          const x = Math.round(cx + dx * (r + 1) - 0.5), y = Math.round(cy + dy * (r + 1) - 0.5);
          if (x < 0 || y < 0 || x >= img.width || y >= img.height || !bin[y * img.width + x]) break;
          r++;
        }
        return r;
      };
      const runs = [], opps = [];
      let bestAxis = 0, bestSpan = -1, maxE = 0;
      for (let a = 0; a < 8; a++) {
        const dx = Math.cos(a * Math.PI / 8), dy = Math.sin(a * Math.PI / 8);
        runs.push(ray(dx, dy));
        opps.push(ray(-dx, -dy));
        if (runs[a] + opps[a] > bestSpan) { bestSpan = runs[a] + opps[a]; bestAxis = a; }
        maxE = Math.max(maxE, runs[a], opps[a]);
      }
      if (bestSpan >= 2.2 * c.width && c.points.length <= 3) {
        // elongated remnant (e.g. a spark tick): rebuild as a straight line
        const dx = Math.cos(bestAxis * Math.PI / 8), dy = Math.sin(bestAxis * Math.PI / 8);
        c.points = [[cx - dx * opps[bestAxis], cy - dy * opps[bestAxis]],
                    [cx + dx * runs[bestAxis], cy + dy * runs[bestAxis]]];
        c.geomLength = bestSpan;
        c.endDeg = [1, 1];
        continue;
      }
      const R = maxE + 4; // beyond the own ink, whatever its shape
      let hits = 0;
      for (let a = 0; a < 16; a++) {
        const x = Math.round(cx + R * Math.cos(a * Math.PI / 8));
        const y = Math.round(cy + R * Math.sin(a * Math.PI / 8));
        if (x >= 0 && x < img.width && y >= 0 && y < img.height && bin[y * img.width + x]) hits++;
      }
      if (hits >= 3) c.debris = true;
    }

    // gap bridging is a multiplier of the local pair width (0 = off).
    // AUTO bridging only fires on measured-degraded sources: on a SHARP
    // image a clear gap between collinear strokes is authored (a dash, a
    // badge cutout) — healing it would weld intentional gaps.
    const bridgeMult = o.bridge === 0 ? 0
      : (typeof o.bridge === 'number' ? o.bridge
      : (blurGrade !== 'sharp' ? 1.5 : 0));
    progress(0.75, 'merging junctions');
    chains = mergeChains(chains, bridgeMult, { ink: bin, w: img.width, h: img.height });

    progress(0.9, 'finishing');
    // Cap finishing at free line ends. The skeleton always stops ~width/2
    // short of the ink face. Probe past the endpoint: a circular profile is
    // a round cap (keep endpoint; the rendered round cap restores the
    // length); a flat full-width face is a butt/square end (move the anchor
    // to the face and finish flat).
    const freeEnds = [];
    for (const c of chains) {
      if (c.closed || c.points.length < 2 || !c.endDeg) continue;
      for (const e of [0, 1])
        if (c.endDeg[e] <= 1)
          freeEnds.push({
            c, e,
            p: e === 0 ? c.points[0] : c.points[c.points.length - 1],
            w: c.width || 1
          });
    }
    const capInkAt = (x, y) => {
      const xi = Math.round(x - 0.5), yi = Math.round(y - 0.5);
      return xi >= 0 && yi >= 0 && xi < img.width && yi < img.height &&
             bin[yi * img.width + xi] === 1;
    };
    // two ends form an (unjoined) corner only when the joint between them is
    // still INKED — parallel neighbor strokes at bold widths come near each
    // other across plain background and must keep their own cap evidence
    const jointBetween = (p, q) => {
      const Lj = Math.hypot(q[0] - p[0], q[1] - p[1]);
      const nj = Math.max(2, Math.ceil(Lj / 3));
      let holes = 0;
      for (let i = 1; i < nj; i++)
