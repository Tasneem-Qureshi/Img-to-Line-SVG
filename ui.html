    // axis-aligned stroke measure wider than a diagonal of the same weight
    for (let i = 0; i + 1 < buckets.length; ) {
      if (buckets[i + 1].width <= buckets[i].width * 1.22 + 0.6) {
        buckets[i].chains.push(...buckets[i + 1].chains);
        buckets[i].maxW = buckets[i + 1].maxW;
        buckets.splice(i + 1, 1);
        weigh(buckets[i]);
        if (i) i--;
      } else i++;
    }
    for (const c of kept) {
      if (seedSet.has(c)) continue;
      let bb = buckets[0];
      for (const b of buckets)
        if (Math.abs(c.width - b.width) < Math.abs(c.width - bb.width)) bb = b;
      bb.chains.push(c); // class width stays seeded by the long chains
    }
    return buckets;
  }

  // chains -> final SVG. strokeWidth is the desired *average* weight in
  // output px (thickness scaling); per-chain widths stay proportional.
  function buildSvg(chains, w, h, opts) {
    const o = Object.assign({
      simplify: 1, smooth: true, minLength: 4, detail: 1,
      stroke: '#000000', strokeWidth: 2, outW: w, outH: h,
      matchWeights: true, avgWidth: 0
    }, opts || {});
    // detail: fit-tolerance multiplier (<1 keeps more anchors, >1 simplifies)
    const dMul = Math.max(0.1, o.detail || 1);
    const kept = [];
    for (const c of chains) {
      const len = c.geomLength != null ? c.geomLength : c.points.length;
      if (c.filled) {
        // filled-shape outline: no pruning — smoothing and fit tolerance
        // scale with the stroke weight, like everything else
        kept.push({
          closed: true, filled: true,
          points: smoothChain(c.points, true, (c.width || 2) * 0.4),
          fitTol: Math.max(1.5, Math.min(45, (c.width || 2) * 0.45)) * dMul,
          width: c.width, geomLength: len
        });
        continue;
      }
      // tiny closed rings (circumference ~ line width) are either skeleton
      // knots at thick junctions (surrounded by ink: drop) or the remnant of
      // a filled dot after upscaling (isolated: keep as a dot)
      if (o.minLength > 0 && c.closed && c.width != null && len < 3.5 * c.width) {
        if (o.ink) {
          let cx = 0, cy = 0;
          for (const p of c.points) { cx += p[0]; cy += p[1]; }
          cx /= c.points.length; cy /= c.points.length;
          const R = len / (2 * Math.PI) + c.width / 2 + 3;
          let hits = 0;
          for (let a = 0; a < 16; a++) {
            const x = Math.round(cx + R * Math.cos(a * Math.PI / 8) - 0.5);
            const y = Math.round(cy + R * Math.sin(a * Math.PI / 8) - 0.5);
            if (x >= 0 && y >= 0 && x < w && y < h && o.ink[y * w + x]) hits++;
          }
          if (hits < 3 && c.width >= Math.max(1, o.minLength)) {
            kept.push({
              closed: false, points: [[cx, cy]],
              width: c.width, geomLength: Math.max(len, 1)
            });
          }
        }
        continue;
      }
      const bothFree = !c.endDeg || (c.endDeg[0] <= 2 && c.endDeg[1] <= 2);
      // roundish isolated blobs (stitch dots): direction is meaningless —
      // render a dot, not a randomly angled tick
      if (!c.closed && bothFree && c.width != null && len < 1.3 * c.width) {
        if (c.width < Math.max(1, o.minLength)) continue; // speckle: dot diameter
        if (c.debris && o.minLength > 0) continue; // fragment shaved off a line
        let cx = 0, cy = 0;
        for (const p of c.points) { cx += p[0]; cy += p[1]; }
        kept.push({
          closed: false,
          points: [[cx / c.points.length, cy / c.points.length]],
          width: c.width, geomLength: Math.max(len, 1)
        });
        continue;
      }
      // disc remnants: a chain no longer than its own widest cross-section,
      // with no other ink around it, is a filled dot (upscaled dots thin
      // into short chains, sometimes with internal junctions)
      if (!c.closed && c.width != null && o.ink &&
          len < (c.maxWidth || c.width) * 1.15 + 2) {
        let cx = 0, cy = 0;
        for (const p of c.points) { cx += p[0]; cy += p[1]; }
        cx /= c.points.length; cy /= c.points.length;
        const R = len / 2 + (c.maxWidth || c.width) / 2 + 3;
        let hits = 0;
        for (let a = 0; a < 16; a++) {
          const x = Math.round(cx + R * Math.cos(a * Math.PI / 8) - 0.5);
          const y = Math.round(cy + R * Math.sin(a * Math.PI / 8) - 0.5);
          if (x >= 0 && y >= 0 && x < w && y < h && o.ink[y * w + x]) hits++;
        }
        if (hits < 3) {
          if ((c.maxWidth || c.width) >= Math.max(1, o.minLength)) {
            kept.push({
              closed: false, points: [[cx, cy]],
              width: c.maxWidth || c.width, geomLength: Math.max(len, 1)
            });
          }
          continue;
        }
      }
      if (c.points.length < Math.max(1, o.minLength)) continue;
      if (o.minLength > 0 && !c.closed && c.endDeg && c.width != null) {
        const a0 = c.endDeg[0] > 2, a1 = c.endDeg[1] > 2;
        if (a0 !== a1) {
          // dead-end hair off a junction. Aggressive pruning only when it
          // hangs off a clearly THICKER line (poke/bridge artifact) — a
          // same-width junction means it's a fragment of the line itself.
          // Caps scale with the junction size: fat strokes grow fat nubs.
          const jw = c.endWidths ? c.endWidths[a0 ? 0 : 1] : c.width;
          // a short stub's own median width is untrustworthy (no clean
          // interior span), but it still separates artifact from feature: a
          // skeleton poke is a thin bump on the parent stroke's flank, while
          // a real feature (a bell's brim tip, a serif) carries close to the
          // drawing's stroke weight even when its tip tapers
          // "clearly exits the junction pool": the pool's radius is jw/2, so
          // full-width ink reaching past ~0.6x jw is a drawn stroke, not a
          // skeleton spur (spurs are thin, or live inside the pool). Fuzz
          // spurs on noisy sources can reach similar lengths, but they stay
          // short relative to the drawing's own stroke weight.
          const realStub = o.avgWidth > 0 &&
            c.width >= o.avgWidth * 0.45 && len > jw * 0.6 &&
            len >= o.avgWidth * 0.85;
          const lim = jw > c.width * 1.6
            ? Math.max(1.5 * c.width, 2.2 * jw)
            : 1.5 * c.width + 2;
          if (!realStub && len < Math.min(Math.max(32, jw * 2.4), lim)) continue;
        } else if (a0 && a1) {
          const ew = c.endWidths || [c.width, c.width];
          // shorter than its two junction blobs combined = lives entirely
          // inside the fused ink, pure skeleton remnant
          if (len < ((ew[0] + 1) / 2 + (ew[1] + 1) / 2) * 0.9) continue;
          const jw = Math.max(ew[0], ew[1]);
          const stubLim = jw > c.width * 1.6
            ? Math.max(20, 2 * jw)          // remnant inside a fat fusion zone
            : Math.min(20, 1.5 * c.width);  // real short connector (H crossbar)
          if (len < stubLim) continue;
        }
      }
      // width-adaptive tolerance: wiggles that are detail on a 2px line are
      // centerline noise on a 14px stroke. Strokes shorter than ~4x their
      // width have no room for width-scaled smoothing or tolerance — both
      // would deform them (a slim arc becomes a bulging comma), so they are
      // fitted conservatively at length-scaled settings instead.
      const isShort = !c.closed && c.width != null && len < 4 * c.width;
      let eps = o.simplify > 0
        ? Math.max(o.simplify, Math.min(26, (c.width || 1) * 0.2)) * dMul
        : o.simplify;
      if (isShort && eps > 0) eps = Math.max(0.75, Math.min(eps, len / 8));
      let s;
      if (o.smooth) {
        // smooth the polyline (width-scaled) before fitting, then fit.
        // Reconstructed corner apexes are pinned back to their exact spot —
        // smoothing must not round away corners we deliberately rebuilt.
        const smoothR = Math.min((c.width || 2) * 0.4, isShort ? len / 6 : 1e9);
        const pts = smoothChain(c.points, !!c.closed, smoothR);
        // smoothing systematically pulls curves INWARD (shrinkage grows with
        // the width-scaled radius, so thick strokes drift visibly off the
        // ink) — re-center every point on the ink midline along its normal
        if (o.ink && c.width) recenterOnInk(pts, !!c.closed, c.width, o.ink, w, h);
        if (c.forced) {
          for (const f of c.forced) {
            let bi = 0, bd = Infinity;
            for (let i = 0; i < pts.length; i++) {
              const d = (pts[i][0] - f[0]) ** 2 + (pts[i][1] - f[1]) ** 2;
              if (d < bd) { bd = d; bi = i; }
            }
            pts[bi] = [f[0], f[1]];
          }
        }
        s = {
          closed: c.closed,
          points: pts,
          fitTol: Math.max(0.75, eps),
          forcedPts: c.forced
        };
      } else {
        s = simplifyChain(c, eps);
      }
      s.width = c.width;
      s.geomLength = len;
      s.caps = c.caps;
      s.endDeg = c.endDeg; // weight classing needs to know junction-attachment
      kept.push(s);
    }
    // a split disc can produce several coincident dots — keep one
    for (let i = kept.length - 1; i >= 0; i--) {
      const a = kept[i];
      if (a.points.length !== 1) continue;
      for (let j = 0; j < i; j++) {
        const b = kept[j];
        if (b.points.length !== 1) continue;
        if (Math.hypot(a.points[0][0] - b.points[0][0], a.points[0][1] - b.points[0][1]) <
            Math.max(a.width || 2, b.width || 2)) {
          b.width = Math.max(a.width || 2, b.width || 2);
          kept.splice(i, 1);
          break;
        }
      }
    }
    const toViewBox = w / o.outW;
    // one path per weight class, finished with the cap/join style measured
    // from the source ink (votes across the class's line ends and corners)
    const mkPath = (chainList, outWidth, traceWidth) => {
      const dots = [], lines = [];
      for (const c of chainList) (c.points.length === 1 ? dots : lines).push(c);
      const corners = [];
      const inkCtx = o.ink ? { ink: o.ink, w, h } : null;
      const d = lines.map(c => chainToPathData(c, o.smooth, c.fitTol, corners, inkCtx)).join(' ');
      let rc = 0, bc = 0;
      for (const c of chainList) if (c.caps)
        for (const cap of c.caps) {
          if (cap === 'round') rc++;
          else if (cap === 'butt') bc++;
        }
      let mj = 0, rj = 0;
      if (o.ink) {
        const wHalf = (traceWidth || 2) / 2;
        const runFrom = (p, dir) => { // ink run length along a direction
          const maxR = wHalf * 3 + 4;
          let r = 0;
          while (r < maxR) { // half-pixel steps: small strokes need the resolution
            const x = Math.round(p[0] + dir[0] * (r + 0.5) - 0.5);
            const y = Math.round(p[1] + dir[1] * (r + 0.5) - 0.5);
            if (x < 0 || y < 0 || x >= w || y >= h || !o.ink[y * w + x]) break;
            r += 0.5;
          }
          return r;
        };
        const rot = (d, a) => [d[0] * Math.cos(a) - d[1] * Math.sin(a),
                               d[0] * Math.sin(a) + d[1] * Math.cos(a)];
        for (const cr of corners) {
          // a miter tip juts out along the outer bisector to (w/2)/cos(t/2)
          // for a turn of t, while a round join stops at w/2 in every
          // outward direction — measure the bisector run and compare it to
          // both expectations. (Side-run ratios fail on exact corners: probes
          // slightly off the bisector graze along the legs' own ink. And the
          // INNER bisector always reaches the joint's square inner corner,
          // sharp pen or round — never take the longer of the two runs.)
          // u - v points to the convex side for either winding direction.
          // Start the probe a little INSIDE the joint: the corner anchor can
          // sit a fraction of a pixel off the ink and clip the run.
          const bis = V.norm(V.sub(cr.u, cr.v));
          const back = Math.max(1.5, wHalf * 0.5);
          const rBis = runFrom([cr.p[0] - bis[0] * back, cr.p[1] - bis[1] * back], bis) - back;
          const cosHalf = Math.sqrt(Math.max(0.05, (1 + V.dot(cr.u, cr.v)) / 2));
          const tip = wHalf / cosHalf;
          // a run far below the round-join radius means the probe started at
          // a junction pool or off the ink — abstain instead of voting round
          if (rBis < wHalf * 0.6) continue;
          // shallow turns barely separate round from miter — abstain
          if (tip - wHalf < Math.max(2, wHalf * 0.22)) continue;
          // both legs must be CLEAN single strokes near the corner: two
          // strokes converging at a shallow angle fuse into a solid wedge
          // whose ink reads like a miter tip
          const armClean = dir => {
            const q = [cr.p[0] + dir[0] * wHalf * 2, cr.p[1] + dir[1] * wHalf * 2];
            const pu = [-dir[1], dir[0]];
            return runFrom(q, pu) + runFrom(q, [-pu[0], -pu[1]]) < wHalf * 3;
          };
          if (!armClean([-cr.u[0], -cr.u[1]]) || !armClean([cr.v[0], cr.v[1]])) continue;
          // pixel quantization clips diagonal runs by ~0.7px, so the gate
          // sits well below the geometric midpoint between round and miter
          if (rBis > wHalf + (tip - wHalf) * 0.3) mj++;
          else rj++;
        }
      }
      return {
        d,
        dotD: dots.map(c => chainToPathData(c, o.smooth, c.fitTol)).join(' '),
        width: outWidth,
        cap: bc > rc ? 'butt' : 'round',
        join: mj > rj ? 'miter' : 'round'
      };
    };
    const fills = kept.filter(c => c.filled);
    const strokesOnly = kept.filter(c => !c.filled);
    let paths;
    if (o.matchWeights && o.avgWidth > 0 && strokesOnly.length && strokesOnly.every(c => c.width != null)) {
      paths = bucketChains(strokesOnly).sort((a, b) => b.width - a.width)
        // x1.03: the 3-4 chamfer distance transform under-measures stroke
        // width by ~3% averaged over edge orientations — corrected here,
        // where MEASURED widths become rendered ones (explicit strokeWidth
        // requests stay untouched)
        .map(b => mkPath(b.chains, b.width / o.avgWidth * o.strokeWidth * 1.03, b.width));
    } else {
      paths = strokesOnly.length ? [mkPath(strokesOnly, o.strokeWidth, o.avgWidth || 2)] : [];
    }
    // solid shapes render as filled outlines, not strokes
    if (fills.length) {
      paths.push({
        d: fills.map(c => chainToPathData(c, o.smooth, c.fitTol)).join(' '),
        dotD: '', width: 0, cap: 'round', join: 'round', filled: true
      });
    }
    const body = paths.map(p => {
      if (p.filled) return `<path d="${p.d}" fill="${o.stroke}" stroke="none"/>`;
      const sw = fmt(Math.max(0.05, p.width * toViewBox));
      let out = '';
      if (p.d) out += `<path d="${p.d}" fill="none" stroke="${o.stroke}" stroke-width="${sw}" ` +
        `stroke-linecap="${p.cap}" stroke-linejoin="${p.join}"/>`;
      // dots need round caps to render, whatever the class voted
      if (p.dotD) out += `<path d="${p.dotD}" fill="none" stroke="${o.stroke}" stroke-width="${sw}" ` +
        `stroke-linecap="round" stroke-linejoin="round"/>`;
      return out;
    }).join('');
    const svg =
      `<svg xmlns="http://www.w3.org/2000/svg" width="${fmt(o.outW)}" height="${fmt(o.outH)}" ` +
      `viewBox="0 0 ${w} ${h}">${body}</svg>`;
    return {
      svg,
      pathCount: kept.length,
      // anchor points in the final geometry (M/C/L commands), not raw samples
      pointCount: paths.reduce((s, p) =>
        s + (p.d.match(/[MCL]/g) || []).length + (p.dotD.match(/M/g) || []).length, 0),
      weights: paths.filter(p => !p.filled).map(p => Math.round(p.width * 100) / 100)
    };
  }

  // Full automatic pipeline: image -> merged, measured chains + the values
  // needed to reproduce the source look (average weight, ink color).
  function trace(img, opts) {
    const o = opts || {};
    progress(0.04, 'analyzing');
    const auto = analyze(img);
    let mode = !o.mode || o.mode === 'auto' ? auto.mode : o.mode;
    if (o.invert && mode !== 'alpha') mode = mode === 'dark' ? 'light' : 'dark';
    const warnings = [];
    let threshold, bin, skel, preprocess = 'none', sharpenApplied = 0, tuning = null;
    let blurGrade = 'soft'; // manual-threshold path: keep bridging permissive
    if (o.threshold != null) {
      threshold = o.threshold;
      bin = fillHoles(binarize(img, threshold, mode), img.width, img.height);
      skel = thin(bin, img.width, img.height);
    } else {
      // Two things are auto-tuned by skeleton-topology score (long skeleton,
      // few junctions = fused lines, few endpoints = broken lines):
      //  - the ink threshold (Otsu alone fuses nearly-touching lines), and
      //  - whether to denoise first (blur before binarizing cleans rough
      //    low-quality sources but would fuse crisp fine detail — so it
      //    only wins when the measured topology says it helps).
      const ladder = base => {
        const strictness = f => mode === 'dark'
          ? Math.round(base * f)
          : Math.round(255 - (255 - base) * f);
        return mode === 'alpha'
          ? [base]
          : [...new Set([1, 0.85, 0.7, 0.55].map(f =>
              Math.max(15, Math.min(254, strictness(f)))))];
      };
      // rank candidates on a half-scale proxy (thinning is the hot path and
      // the topology ORDERING is preserved), then thin only the winner at
      // full resolution
      // NOTE: the whole variant competition is tuned at THIS proxy
      // resolution — changing the cutoff or filter reshuffles which
      // candidates win across every scenario (dense hatching trades a
      // little coverage for it; see test 37's bounds)
      let proxy = img;
      if (img.width * img.height > 700 * 700) {
        const pw = img.width >> 1, ph = img.height >> 1;
        const pd = new Uint8ClampedArray(pw * ph * 4);
        for (let y = 0; y < ph; y++) {
          for (let x = 0; x < pw; x++) {
            const s0 = (y * 2 * img.width + x * 2) * 4;
            const s1 = s0 + 4, s2 = s0 + img.width * 4, s3 = s2 + 4;
            const d = (y * pw + x) * 4;
            for (let ch = 0; ch < 4; ch++)
              pd[d + ch] = (img.data[s0 + ch] + img.data[s1 + ch] + img.data[s2 + ch] + img.data[s3 + ch]) / 4;
          }
        }
        proxy = { width: pw, height: ph, data: pd };
      }
      // score = skeleton topology minus an ink-fraction sanity penalty
      // (topology alone can't see that a candidate "traced" the background)
      const totalPx = proxy.width * proxy.height;
      const scoreBin = raw => {
        const b = fillHoles(raw, proxy.width, proxy.height);
        const s = thin(b, proxy.width, proxy.height);
        const st = topoStats(s, proxy.width, proxy.height);
        let inkN = 0;
        for (let i = 0; i < b.length; i++) inkN += b[i];
        return { topo: st.score, inkN };
      };
      progress(0.1, 'tuning threshold');
      const blurInfo = measureBlur(proxy, o.srcScale);
      blurGrade = blurInfo.grade;
      const shAmt = o.sharpen === 0 ? 0
        : (typeof o.sharpen === 'number' ? o.sharpen
        : (blurInfo.grade !== 'sharp' ? 1.6 : 0));
      const cands = [];
      const half = arr => arr.filter((_, i) => i % 2 === 0);
      for (const t of ladder(auto.threshold))
        cands.push({ key: 'none', t, ...scoreBin(binarize(proxy, t, mode)) });
      const proxBlur = boxBlurRGBA(proxy, proxy === img ? 2 : 1);
      for (const t of half(ladder(analyze(proxBlur).threshold)))
        cands.push({ key: 'blur', t, ...scoreBin(binarize(proxBlur, t, mode)) });
      const sharpRadius = blurInfo.grade === 'severe'
        ? Math.round(Math.min(proxy.width, proxy.height) / 70)
        : Math.round(Math.min(proxy.width, proxy.height) / 130);
      if (shAmt > 0 && mode !== 'alpha') {
        // unsharp mask restores edge contrast on soft/blurry sources —
        // radius scales with how blurred the image measured
        const pSharp = unsharp(proxy, Math.max(2, sharpRadius), shAmt);
        for (const t of ladder(analyze(pSharp).threshold))
          cands.push({ key: 'sharp', t, ...scoreBin(binarize(pSharp, t, mode)) });
      }
      if (mode !== 'alpha') {
        // background flattening + Sauvola + hysteresis: the answer to uneven
        // lighting and shadows that no global threshold can pass
        cands.push({ key: 'adaptive', t: auto.threshold,
          ...scoreBin(sauvolaBin(flattenBg(proxy), mode, o.thresholdOffset || 0)) });
      }
      // ink economy (same structure captured with less ink = more faithful;
      // a blur/sharpen halo is fat, the true stroke core lean) applies WITHIN
      // each preprocessed variant's ladder and between the finalists — but
      // NOT within the raw ladder: there it would reward ever-stricter
      // thresholds for eroding legitimate dots and thinning strokes.
      const econPick = arr => {
        let mi = Infinity;
        for (const c of arr) if (c.inkN > totalPx * 0.002) mi = Math.min(mi, c.inkN);
        if (!isFinite(mi)) mi = 0;
        let b = null;
        for (const c of arr) {
          c.score = c.topo - Math.max(0, c.inkN - mi) * 0.05;
          if (!b || c.score > b.score) b = c;
        }
        return b;
      };
      let bestNone = null;
      for (const c of cands)
        if (c.key === 'none' && (!bestNone || c.topo > bestNone.topo)) bestNone = c;
      const bestOther = econPick(cands.filter(c => c.key !== 'none'));
      const finalists = [bestNone, bestOther].filter(Boolean);
      let minInk = Infinity;
      for (const c of finalists) if (c.inkN > totalPx * 0.002) minInk = Math.min(minInk, c.inkN);
      if (!isFinite(minInk)) minInk = 0;
      for (const c of finalists) c.score = c.topo - Math.max(0, c.inkN - minInk) * 0.05;
      // fidelity bias: preprocessing must win DECISIVELY on SHARP images
      // (protecting crisp fine detail and clean icon renders) — on
      // measured-blurry images the remediation is expected to win, so the
      // bar drops
      const gate = s => blurInfo.grade === 'sharp' ? s * 1.3 + 120 : s * 0.85;
      const best = bestOther && (!bestNone || bestOther.score > gate(bestNone.score))
        ? bestOther : bestNone;
      trace.lastTuning = { cands, best };
      tuning = {
        grade: blurInfo.grade, p95: blurInfo.p95,
        noneScore: bestNone ? Math.round(bestNone.score) : null,
        altKey: bestOther ? bestOther.key : null,
        altScore: bestOther ? Math.round(bestOther.score) : null
      };
      preprocess = best.key;
      if (best.key === 'sharp') sharpenApplied = shAmt;
      if (blurInfo.grade === 'severe')
        warnings.push('Image is very blurry — result may need cleanup; a sharper source is recommended.');
      // a photo tell: the RAW image has no line structure at any threshold
      // (negative topology score) and only preprocessing "found" some —
      // sharpening a photo manufactures traceable texture edges
      if (best.score <= 0 || (bestNone && bestNone.score <= 0 && best !== bestNone))
        warnings.push('No clear line structure found — this may be a photo or continuous-tone image; the trace may not be meaningful.');
      const off = o.thresholdOffset || 0;
      if (best.key === 'adaptive') {
        threshold = best.t;
        bin = fillHoles(sauvolaBin(flattenBg(img), mode, off), img.width, img.height);
      } else {
        let srcImg = img;
        if (best.key === 'blur') srcImg = boxBlurRGBA(img, 2);
        else if (best.key === 'sharp')
          srcImg = unsharp(img, Math.max(2, blurInfo.grade === 'severe'
            ? Math.round(Math.min(img.width, img.height) / 70)
            : Math.round(Math.min(img.width, img.height) / 130)), shAmt);
        threshold = Math.max(1, Math.min(254, best.t + (mode === 'light' ? -off : off)));
        bin = fillHoles(binarize(srcImg, threshold, mode), img.width, img.height);
      }
      progress(0.4, 'thinning');
      skel = thin(bin, img.width, img.height);
    }
    progress(0.62, 'tracing lines');
    let chains = extractChains(skel, img.width, img.height);

    const dist = distanceTransform(bin, img.width, img.height);
    for (const c of chains) {
      const raw = [], cum = [0];
      let glen = 0, maxS = 0;
      for (let k = 0; k < c.points.length; k++) {
        const p = c.points[k];
        const s = dist[(p[1] - 0.5) * img.width + (p[0] - 0.5)];
        raw.push(s);
        if (s > maxS) maxS = s;
        if (k) {
          glen += Math.hypot(p[0] - c.points[k - 1][0], p[1] - c.points[k - 1][1]);
          cum.push(glen);
        }
      }
      const med = a => { const s = a.slice().sort((x, y) => x - y); return s[s.length >> 1]; };
      const first = raw[0], last = raw[raw.length - 1];
      // internal widths keep the raw chamfer scale (every geometry gate is
      // tuned against it); the ~3% chamfer under-measurement is compensated
      // at RENDER time (W_CAL in buildSvg)
      const DSC = 3;
      c._pw = raw.map(s => Math.max(1, 2 * s / DSC - 1)); // per-point widths
      // the line's own width comes from clean INTERIOR spans only: ink pools
      // at junctions, corners and caps and inflates the distance transform,
      // while tapering tips deflate it — both bias a whole-chain median
      const allMed = med(raw);
      let base = raw;
      if (!c.closed) {
        const marginPx = 1.5 * Math.max(1, 2 * allMed / DSC - 1); // ~1.5x width
        const interior = [];
        for (let k = 0; k < raw.length; k++)
          if (cum[k] >= marginPx && glen - cum[k] >= marginPx) interior.push(raw[k]);
        if (interior.length >= 5) base = interior;
      }
      let mRad = med(base);
      { // clip pooled outliers (interior corners/crossovers), re-take median
        const pool = [];
        for (const s of base) if (s <= mRad * 1.25) pool.push(s);
        if (pool.length >= 5 && pool.length >= base.length * 0.6) mRad = med(pool);
      }
      c.width = Math.max(1, 2 * mRad / DSC - 1);
      // max width: a filled dot's chain is as "wide" as it is long at its
      // center, unlike a line — used to recognize disc remnants
      c.maxWidth = Math.max(1, 2 * maxS / DSC - 1);
      c.endWidths = [Math.max(1, 2 * first / DSC - 1), Math.max(1, 2 * last / DSC - 1)];
      c.geomLength = glen;
    }

    // ---- filled shapes (arrowheads, solid dots, badges) ----
    // Icons mix strokes with SOLID shapes. A region much fatter than the
    // stroke weight is a fill, not a line — its skeleton "spine" is
    // meaningless. Carve such regions out and trace their OUTLINE instead,
    // to be emitted as filled polygons with sharp corners.
    let strokeWmed = 2;
    {
      const W = img.width, Hh = img.height;
      // length-weighted median width: real strokes dominate total length,
      // so the fat (short) spines of filled shapes can't inflate it
      const sw = chains.filter(c => c.points.length > 2)
        .map(c => ({ w: c.width, l: c.geomLength || c.points.length }))
        .sort((a, b) => a.w - b.w);
      let totL = 0;
      for (const e of sw) totL += e.l;
      let accL = 0, strokeW = 2;
      for (const e of sw) {
        accL += e.l;
        if (accL >= totL / 2) { strokeW = e.w; break; }
      }
      strokeWmed = strokeW;
      const coreR = Math.max(2.5, strokeW * 0.95);
      const seenC = new Uint8Array(W * Hh);
      const regionAll = new Uint8Array(W * Hh);
      const stack = [];
      const filled = [];
      for (let i0 = 0; i0 < W * Hh; i0++) {
        if (seenC[i0] || dist[i0] / 3 < coreR) continue;
        const comp = [];
        seenC[i0] = 1;
        stack.push(i0);
        let minX = 1e9, maxX = -1, minY = 1e9, maxY = -1, maxD = 0;
        while (stack.length) {
          const i = stack.pop();
          comp.push(i);
          const x = i % W, y = (i / W) | 0;
          if (dist[i] > maxD) maxD = dist[i];
          if (x < minX) minX = x;
          if (x > maxX) maxX = x;
          if (y < minY) minY = y;
          if (y > maxY) maxY = y;
          const nbs = [x > 0 ? i - 1 : -1, x < W - 1 ? i + 1 : -1, y > 0 ? i - W : -1, y < Hh - 1 ? i + W : -1];
          for (const nb of nbs)
            if (nb >= 0 && !seenC[nb] && dist[nb] / 3 >= coreR) { seenC[nb] = 1; stack.push(nb); }
        }
        const thick = (2 * maxD) / 3;
        if (comp.length < coreR * coreR * 1.5) continue; // speck
        // elongated fat = just a thick line (renders identically as stroke)
        if (Math.max(maxX - minX, maxY - minY) > 3.2 * thick) continue;
        // grow the core back out to the ink boundary (the fattest point of
        // the blob dictates how far the boundary can be from the core)
        const K = Math.ceil(maxD / 3) + 2;
        let frontier = comp;
        for (const i of comp) regionAll[i] = 1;
        const region = new Set(comp);
        for (let step = 0; step < K && frontier.length; step++) {
          const nxt = [];
          for (const i of frontier) {
            const x = i % W, y = (i / W) | 0;
            const nbs = [x > 0 ? i - 1 : -1, x < W - 1 ? i + 1 : -1, y > 0 ? i - W : -1, y < Hh - 1 ? i + W : -1];
            for (const nb of nbs)
              if (nb >= 0 && bin[nb] && !regionAll[nb]) { regionAll[nb] = 1; region.add(nb); nxt.push(nb); }
          }
          frontier = nxt;
        }
        // junction guard: a genuine fill has at most ONE stroke attached;
        // several strokes passing through means this is a fused crossing
        let passers = 0;
        for (const c of chains) {
          let inside = 0;
          for (const p of c.points)
            if (regionAll[(p[1] - 0.5) * W + (p[0] - 0.5)]) inside++;
          if (inside > 0 && inside / c.points.length < 0.7) passers++;
        }
        if (passers >= 2) {
          for (const i of region) regionAll[i] = 0;
          continue;
        }
        // Moore-neighbor boundary trace of the region
        let start = -1;
        for (const i of region) if (start < 0 || i < start) start = i;
        const dxs = [1, 1, 0, -1, -1, -1, 0, 1], dys = [0, 1, 1, 1, 0, -1, -1, -1];
        const inR = (x, y) => x >= 0 && y >= 0 && x < W && y < Hh && regionAll[y * W + x];
        const pts = [];
        let cx = start % W, cy = (start / W) | 0, back = 4;
        let guard = 8 * region.size + 64;
        const sx = cx, sy = cy;
        while (guard-- > 0) {
          pts.push([cx + 0.5, cy + 0.5]);
          let d = -1;
          for (let k = 0; k < 8; k++) {
            const cand = (back + 1 + k) % 8;
            if (inR(cx + dxs[cand], cy + dys[cand])) { d = cand; break; }
          }
          if (d < 0) break; // isolated pixel
          cx += dxs[d];
          cy += dys[d];
          back = (d + 4) % 8;
          if (cx === sx && cy === sy) break;
        }
        if (pts.length >= 12) {
          let per = 0;
          for (let i = 1; i < pts.length; i++)
            per += Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]);
          filled.push({
            closed: true, filled: true, points: pts,
            width: strokeW, geomLength: per, endDeg: [2, 2]
          });
        }
      }
      if (filled.length) {
        // drop skeleton spines living inside carved regions
        chains = chains.filter(c => {
          let inside = 0;
          for (const p of c.points)
            if (regionAll[(p[1] - 0.5) * W + (p[0] - 0.5)]) inside++;
          return inside / c.points.length < 0.7;
        });
        chains.push(...filled);
      }
    }

    // Trim chain ends back out of junction blobs: where strokes cross, the
    // ink is locally much wider and the skeleton wanders, bending every
    // line entering the junction. Each trimmed end remembers the junction
    // point so merging can bridge through it cleanly.
    for (const c of chains) {
      if (c.closed || !c.endDeg) { delete c._pw; continue; }
      c.trim = [null, null];
      for (const e of [0, 1]) {
        if (c.endDeg[e] <= 2 || c.points.length < 6) continue;
        const jr = ((c.endWidths ? c.endWidths[e] : c.width) + 1) / 2;
        const minTrim = jr * 1.15;
        if (c.geomLength < minTrim * 2.5) continue;
        // keep trimming while the ink is still fused (wider than the line
        // itself) — tangential merges fuse far beyond the junction radius
        const wLimit = Math.max(c.width * 1.35, c.width + 2);
        const maxTrim = Math.min(c.geomLength * 0.35, jr * 8);
        const jp = e === 0 ? c.points[0] : c.points[c.points.length - 1];
        let acc = 0, cut = 0, clear = 0;
        const n = c.points.length;
        while (cut + 3 < n && acc < maxTrim) {
          const i = e === 0 ? cut : n - 1 - cut;
          if (acc >= minTrim && c._pw[i] <= wLimit) {
            if (++clear >= 3) break;
          } else clear = 0;
          const a = e === 0 ? c.points[cut] : c.points[n - 1 - cut];
          const b = e === 0 ? c.points[cut + 1] : c.points[n - 2 - cut];
          acc += Math.hypot(b[0] - a[0], b[1] - a[1]);
          cut++;
        }
        cut = Math.max(0, cut - clear);
        if (!cut) continue;
        if (e === 0) {
          c.points = c.points.slice(cut);
          c._pw = c._pw.slice(cut);
        } else {
          c.points = c.points.slice(0, c.points.length - cut);
          c._pw = c._pw.slice(0, c._pw.length - cut);
        }
        c.geomLength = Math.max(1, c.geomLength - acc);
        c.trim[e] = { p: jp, r: jr };
      }
      delete c._pw;
    }

    // Tiny isolated chains: measure the ink's own extent by ray-casting.
    // A short thick tick can collapse to a single skeleton pixel — if its
    // ink is clearly elongated, rebuild it as a line along its axis. Then
    // check a ring BEYOND the own ink: other ink nearby = debris fragment.
    for (const c of chains) {
      if (c.closed || c.geomLength >= 1.3 * c.width) continue;
      if (c.endDeg && (c.endDeg[0] > 2 || c.endDeg[1] > 2)) continue;
      let cx = 0, cy = 0;
      for (const p of c.points) { cx += p[0]; cy += p[1]; }
      cx /= c.points.length; cy /= c.points.length;
      const ray = (dx, dy) => {
        let r = 0;
        while (r < 80) {
          const x = Math.round(cx + dx * (r + 1) - 0.5), y = Math.round(cy + dy * (r + 1) - 0.5);
          if (x < 0 || y < 0 || x >= img.width || y >= img.height || !bin[y * img.width + x]) break;
          r++;
        }
        return r;
      };
      const runs = [], opps = [];
      let bestAxis = 0, bestSpan = -1, maxE = 0;
      for (let a = 0; a < 8; a++) {
        const dx = Math.cos(a * Math.PI / 8), dy = Math.sin(a * Math.PI / 8);
        runs.push(ray(dx, dy));
        opps.push(ray(-dx, -dy));
        if (runs[a] + opps[a] > bestSpan) { bestSpan = runs[a] + opps[a]; bestAxis = a; }
        maxE = Math.max(maxE, runs[a], opps[a]);
      }
      if (bestSpan >= 2.2 * c.width && c.points.length <= 3) {
        // elongated remnant (e.g. a spark tick): rebuild as a straight line
        const dx = Math.cos(bestAxis * Math.PI / 8), dy = Math.sin(bestAxis * Math.PI / 8);
        c.points = [[cx - dx * opps[bestAxis], cy - dy * opps[bestAxis]],
                    [cx + dx * runs[bestAxis], cy + dy * runs[bestAxis]]];
        c.geomLength = bestSpan;
        c.endDeg = [1, 1];
        continue;
      }
      const R = maxE + 4; // beyond the own ink, whatever its shape
      let hits = 0;
      for (let a = 0; a < 16; a++) {
        const x = Math.round(cx + R * Math.cos(a * Math.PI / 8));
        const y = Math.round(cy + R * Math.sin(a * Math.PI / 8));
        if (x >= 0 && x < img.width && y >= 0 && y < img.height && bin[y * img.width + x]) hits++;
      }
      if (hits >= 3) c.debris = true;
    }

    // gap bridging is a multiplier of the local pair width (0 = off).
    // AUTO bridging only fires on measured-degraded sources: on a SHARP
    // image a clear gap between collinear strokes is authored (a dash, a
    // badge cutout) — healing it would weld intentional gaps.
    const bridgeMult = o.bridge === 0 ? 0
      : (typeof o.bridge === 'number' ? o.bridge
      : (blurGrade !== 'sharp' ? 1.5 : 0));
    progress(0.75, 'merging junctions');
    chains = mergeChains(chains, bridgeMult, { ink: bin, w: img.width, h: img.height });

    progress(0.9, 'finishing');
    // Cap finishing at free line ends. The skeleton always stops ~width/2
    // short of the ink face. Probe past the endpoint: a circular profile is
    // a round cap (keep endpoint; the rendered round cap restores the
    // length); a flat full-width face is a butt/square end (move the anchor
    // to the face and finish flat).
    const freeEnds = [];
    for (const c of chains) {
      if (c.closed || c.points.length < 2 || !c.endDeg) continue;
      for (const e of [0, 1])
        if (c.endDeg[e] <= 1)
          freeEnds.push({
            c, e,
            p: e === 0 ? c.points[0] : c.points[c.points.length - 1],
            w: c.width || 1
          });
    }
    for (const c of chains) {
      if (c.closed || c.points.length < 3 || !c.endDeg) continue;
      c.caps = [null, null];
      // strokes shorter than ~4x their width: end tangents are too noisy to
      // probe reliably, and a wrong flat-face extension visibly deforms the
      // whole mark — keep the provable minimum (round caps)
      if ((c.geomLength || c.points.length) < 4 * (c.width || 1)) {
        for (const e of [0, 1]) if (c.endDeg[e] <= 1) c.caps[e] = 'round';
        continue;
      }
      for (const e of [0, 1]) {
        if (c.endDeg[e] > 1) continue; // attached ends have no cap
        {
          // an end near another chain's end is an (unjoined) corner — the
          // "ink face" out there belongs to the neighbour stroke, so any
          // flat-cap extension would overshoot the joint as a hook
          const pe = e === 0 ? c.points[0] : c.points[c.points.length - 1];
          const nearOther = freeEnds.some(o =>
            o.c !== c &&
            Math.hypot(o.p[0] - pe[0], o.p[1] - pe[1]) < ((c.width || 1) + o.w) * 1.4);
          if (nearOther) { c.caps[e] = 'round'; continue; }
        }
        const n = c.points.length;
        const pEnd = e === 0 ? c.points[0] : c.points[n - 1];
        const k = Math.min(6, n - 1);
        const pIn = e === 0 ? c.points[k] : c.points[n - 1 - k];
        let tx = pEnd[0] - pIn[0], ty = pEnd[1] - pIn[1];
        const tl = Math.hypot(tx, ty) || 1;
        tx /= tl; ty /= tl;
        const wHalf = (c.width || 2) / 2;
        const inkAt = (x, y) => {
          const xi = Math.round(x - 0.5), yi = Math.round(y - 0.5);
          return xi >= 0 && yi >= 0 && xi < img.width && yi < img.height &&
                 bin[yi * img.width + xi] === 1;
        };
        let L = 0;
        const maxL = Math.ceil(wHalf * 2 + 4);
        while (L < maxL && inkAt(pEnd[0] + tx * (L + 1), pEnd[1] + ty * (L + 1))) L++;
        if (L < Math.max(2, wHalf * 0.4)) { c.caps[e] = 'butt'; continue; }
        const d = L * 0.75, off = wHalf * 0.8;
        const flat = inkAt(pEnd[0] + tx * d - ty * off, pEnd[1] + ty * d + tx * off) &&
                     inkAt(pEnd[0] + tx * d + ty * off, pEnd[1] + ty * d - tx * off);
        // the "face" must belong to THIS stroke: ink clearly wider than the
        // stroke out there means the probe entered a neighboring stroke or
        // joint — extending would leave an overshoot nub with its own cap
        const wide = inkAt(pEnd[0] + tx * d - ty * wHalf * 1.7, pEnd[1] + ty * d + tx * wHalf * 1.7) ||
                     inkAt(pEnd[0] + tx * d + ty * wHalf * 1.7, pEnd[1] + ty * d - tx * wHalf * 1.7);
        if (flat && !wide) {
          const q = [pEnd[0] + tx * Math.max(0, L - 1), pEnd[1] + ty * Math.max(0, L - 1)];
          if (e === 0) c.points.unshift(q);
          else c.points.push(q);
          c.caps[e] = 'butt';
        } else {
          c.caps[e] = 'round';
        }
      }
    }

    const total = img.width * img.height;
    let inkCount = 0, skelCount = 0, r = 0, g = 0, b = 0;
    for (let i = 0; i < total; i++) {
      if (bin[i]) inkCount++;
      if (skel[i]) { // line centers: color unaffected by AA edge pixels
        skelCount++;
        const p = i * 4;
        r += img.data[p]; g += img.data[p + 1]; b += img.data[p + 2];
      }
    }
    // average stroke weight from the line chains themselves — carved-out
    // filled shapes must not inflate it
    let wSum = 0, lSum = 0;
    for (const c of chains)
      if (!c.filled && c.points.length > 1) {
        wSum += (c.width || 1) * (c.geomLength || 1);
        lSum += c.geomLength || 1;
      }
    const avgStrokeWidth = lSum ? Math.max(1, wSum / lSum)
      : (skelCount ? Math.max(1, inkCount / skelCount) : 2);
    const toHex = v => Math.round(v / (skelCount || 1)).toString(16).padStart(2, '0');
    const inkColor = skelCount ? '#' + toHex(r) + toHex(g) + toHex(b) : '#000000';
    // photo tell: real line art has consistent stroke widths along chains;
    // photo/texture blob spines have chaotic widths
    {
      let n = 0, s1 = 0, s2 = 0;
      for (const c of chains)
        if (!c.filled && c._pw && c.points.length > 4)
          for (const wv of c._pw) { n++; s1 += wv; s2 += wv * wv; }
      if (n > 40) {
        const m = s1 / n, cv = Math.sqrt(Math.max(0, s2 / n - m * m)) / m;
        if (cv > 0.62 && !warnings.some(w => w.includes('line structure')))
          warnings.push('No clear line structure found — this may be a photo or continuous-tone image; the trace may not be meaningful.');
      }
    }

    return { chains, width: img.width, height: img.height, mode, threshold, preprocess, sharpenApplied, tuning, warnings, avgStrokeWidth, inkColor, ink: bin };
  }

  return {
    analyze, binarize, thin, extractChains, mergeChains, simplifyChain,
    chainToPathData, buildSvg, trace, rdp, otsu, distanceTransform, bucketChains,
    setProgress
  };
})();
if (typeof module !== 'undefined' && module.exports) module.exports = LineTracer;
/* ===== TRACER-END ===== */
</script>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const dropzone = $('dropzone'), fileInput = $('fileInput');
  const srcImg = $('srcImg'), traceImg = $('traceImg');
  const actions = $('actions'), status = $('status'), warn = $('warn');

  const PATH_WARN = 300;   // above this Figma gets sluggish
  const PATH_CAP = 900;    // hard cap: keep the longest lines, tell the user

  const state = {
    image: null,
    name: 'Line trace',
    exportScale: 1,   // selection exports come in upscaled; divide back out
    traced: null,
    svg: null,
    lastBlobUrl: null,
    binUrl: null,
    worker: null,
    job: 0,           // stale worker replies are dropped by job id
    tracing: false,
    autoSharpen: true // sharpen slider mirrors the auto value until touched
  };

  function syncHeight() {
    setTimeout(() => {
      const h = Math.min(740, document.documentElement.scrollHeight + 8);
      parent.postMessage({ pluginMessage: { type: 'ui-resize', height: h } }, '*');
    }, 30);
  }

  // ---------- image loading ----------
  function loadBlob(blob, name, exportScale) {
    const url = URL.createObjectURL(blob);
    const img = new Image();
    img.onload = () => {
      state.image = img;
      state.name = name || 'Line trace';
      state.exportScale = exportScale || 1;
      // new image: back to fully automatic
      state.autoSharpen = true;
      $('thickness').value = 100; $('thicknessOut').textContent = '100%';
      $('thrOff').value = 0; $('thrOffOut').textContent = 'auto';
      $('detail').value = 50; $('detailOut').textContent = 'auto';
      $('bridge').value = 55; $('bridgeOut').textContent = 'auto';
      $('sharpen').value = 0; $('sharpenOut').textContent = 'auto';
      $('invert').checked = false;
      $('binView').checked = false;
      srcImg.src = url;
      dropzone.classList.add('has-image');
      actions.style.display = 'flex';
      $('thicknessRow').classList.add('visible');
      $('adjust').classList.add('visible');
      syncHeight();
      retrace();
    };
    img.onerror = () => setStatus('Could not read that image.', true);
    img.src = url;
  }

  fileInput.onchange = () => fileInput.files[0] && loadBlob(fileInput.files[0], fileInput.files[0].name.replace(/\.[^.]+$/, ''));
  $('openBtn').onclick = () => fileInput.click();
  dropzone.onclick = () => { if (!state.image) fileInput.click(); };

  dropzone.ondragover = e => { e.preventDefault(); dropzone.classList.add('dragover'); };
  dropzone.ondragleave = () => dropzone.classList.remove('dragover');
  dropzone.ondrop = e => {
    e.preventDefault();
    dropzone.classList.remove('dragover');
    const f = e.dataTransfer.files[0];
    if (f && f.type.startsWith('image/')) loadBlob(f, f.name.replace(/\.[^.]+$/, ''));
  };

  document.onpaste = e => {
    for (const item of e.clipboardData.items) {
      if (item.type.startsWith('image/')) {
        loadBlob(item.getAsFile(), 'Pasted image');
        return;
      }
    }
  };

  $('selBtn').onclick = () => {
    setStatus('Exporting selected layer…');
    parent.postMessage({ pluginMessage: { type: 'get-selection-image' } }, '*');
  };

  window.onmessage = e => {
    const msg = e.data.pluginMessage;
    if (!msg) return;
    if (msg.type === 'selection-state') {
      $('selBtn').disabled = !msg.hasSelection;
    } else if (msg.type === 'selection-image') {
      if (msg.error) { setStatus(msg.error, true); return; }
      loadBlob(new Blob([msg.bytes], { type: 'image/png' }), msg.name, msg.scale);
    }
  };

  // ---------- tracing (worker so the UI never freezes) ----------
  function getImageData() {
    const img = state.image;
    // trace well above native size: bicubic upsampling turns sub-pixel gaps
    // and anti-aliased edges into resolvable gradients. Small/low-res images
    // need MORE than 2x — a 300px icon traces blocky at 600px but cleanly at
    // ~1400px — so aim for a minimum working resolution.
    const nat = Math.max(img.naturalWidth, img.naturalHeight);
    const target = Math.min(2600, Math.max(nat * 2, 1400));
    // no upscale cap: a 96px icon needs ~15x to reach working resolution —
    // bicubic blur at high factors is handled by the geometry snapping
    const scale = target / nat;
    const w = Math.max(2, Math.round(img.naturalWidth * scale));
    const h = Math.max(2, Math.round(img.naturalHeight * scale));
    const canvas = document.createElement('canvas');
    canvas.width = w; canvas.height = h;
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = 'high';
    ctx.drawImage(img, 0, 0, w, h);
    const id = ctx.getImageData(0, 0, w, h);
    id.srcScale = scale; // blur is graded at source resolution
    return id;
  }

  function currentOpts() {
    const opts = {};
    const off = +$('thrOff').value;
    if (off) opts.thresholdOffset = off;
    if ($('invert').checked) opts.invert = true;
    if (!state.autoSharpen) opts.sharpen = +$('sharpen').value / 100;
    const b = +$('bridge').value;
    if (b !== 55) opts.bridge = b / 100; // 55% = the automatic default
    return opts;
  }

  function getWorker() {
    if (state.worker) return state.worker;
    const src = document.getElementById('tracerScript');
    if (!src || typeof Worker === 'undefined') return null;
    try {
      const harness =
        '\nLineTracer.setProgress((f, label) =>' +
        ' self.postMessage({ type: "progress", job: self.__job, f, label }));' +
        '\nself.onmessage = e => {' +
        '\n  const { job, buf, width, height, opts } = e.data;' +
        '\n  self.__job = job;' +
        '\n  try {' +
        '\n    const t = LineTracer.trace({ data: new Uint8ClampedArray(buf), width, height }, opts);' +
        '\n    self.postMessage({ type: "done", job, traced: t }, [t.ink.buffer]);' +
        '\n  } catch (err) {' +
        '\n    self.postMessage({ type: "error", job, message: err && err.message || String(err) });' +
        '\n  }' +
        '\n};';
      const blob = new Blob([src.textContent, harness], { type: 'text/javascript' });
      const w = new Worker(URL.createObjectURL(blob));
      w.onmessage = onWorkerMsg;
      w.onerror = () => { if (state.tracing) traceFailed('worker error'); };
      state.worker = w;
      return w;
    } catch (_) {
      return null; // fall back to tracing on the main thread
    }
  }

  let t0 = 0;
  function retrace() {
    if (!state.image) return;
    if (state.tracing && state.worker) {
      // a new request supersedes a running trace — kill it, don't queue
      state.worker.terminate();
      state.worker = null;
    }
    state.job++;
    const job = state.job;
    state.tracing = true;
    showProgress(0.02, 'starting');
    t0 = performance.now();
    const imgData = getImageData();
    const opts = currentOpts();
    opts.srcScale = imgData.srcScale || 1;
    const w = getWorker();
    if (w) {
      w.postMessage(
        { job, buf: imgData.data.buffer, width: imgData.width, height: imgData.height, opts },
        [imgData.data.buffer]
      );
    } else {
      setTimeout(() => { // let the status paint before blocking
        if (job !== state.job) return;
        try { finishTrace(LineTracer.trace(imgData, opts)); }
        catch (err) { traceFailed(err.message); }
      }, 30);
    }
  }

  function onWorkerMsg(e) {
    const m = e.data;
    if (m.job !== state.job) return; // superseded
    if (m.type === 'progress') showProgress(m.f, m.label);
    else if (m.type === 'done') finishTrace(m.traced);
    else if (m.type === 'error') traceFailed(m.message);
  }

  $('cancelBtn').onclick = () => {
    state.job++; // invalidate anything in flight
    if (state.worker) { state.worker.terminate(); state.worker = null; }
    state.tracing = false;
    hideProgress();
    setStatus('Trace cancelled.');
  };

  function showProgress(f, label) {
    $('progressRow').classList.add('visible');
    $('progressBar').firstElementChild.style.width = Math.round(f * 100) + '%';
    $('progressLabel').textContent = label || '';
    status.innerHTML = '';
  }
  function hideProgress() { $('progressRow').classList.remove('visible'); }

  function traceFailed(message) {
    state.tracing = false;
    hideProgress();
    setStatus('Trace failed: ' + message, true);
  }

  function finishTrace(traced) {
    state.tracing = false;
    hideProgress();
    state.traced = traced;
    // mirror the automatically chosen sharpening in the slider so the user
    // can see it happened and take over from there
    if (state.autoSharpen) {
      $('sharpen').value = Math.round((traced.sharpenApplied || 0) * 100);
      $('sharpenOut').textContent = traced.sharpenApplied
        ? 'auto ' + Math.round(traced.sharpenApplied * 100) + '%' : 'auto';
    }
    if (state.binUrl) { URL.revokeObjectURL(state.binUrl); state.binUrl = null; }
    // surface the automatic decisions so a misfire is visible, not silent
    const tun = traced.tuning;
    if (tun) {
      const prep = { none: 'no preprocessing', blur: 'denoised', sharp: 'sharpened',
                     adaptive: 'lighting corrected' }[traced.preprocess] || traced.preprocess;
      let s = `auto: ${tun.grade} source · threshold ${traced.threshold} · ${prep}`;
      if (traced.preprocess !== 'none' && tun.altScore != null && tun.noneScore != null)
        s += ` — structure score ${tun.altScore} vs ${tun.noneScore} unprocessed`;
      $('autoInfo').textContent = s;
    } else {
      $('autoInfo').textContent = '';
    }
    render(performance.now() - t0);
  }

  function render(traceMs) {
    if (!state.traced) return;
    const t = state.traced;
    const outW = state.image.naturalWidth / state.exportScale;
    const outH = state.image.naturalHeight / state.exportScale;
    const thickness = (+$('thickness').value || 100) / 100;
    const detailV = +$('detail').value; // 50 = auto; higher keeps more anchors
    // hard cap: an extreme trace (photo, texture) can emit thousands of
    // fragments — keep the longest lines so Figma import stays usable
    let chains = t.chains, dropped = 0;
    if (chains.length > PATH_CAP) {
      dropped = chains.length - PATH_CAP;
      chains = chains.slice()
        .sort((a, b) => (b.geomLength || b.points.length) - (a.geomLength || a.points.length))
        .slice(0, PATH_CAP);
    }
    const { svg, pathCount, pointCount, weights } = LineTracer.buildSvg(chains, t.width, t.height, {
      simplify: 1,
      smooth: true,
      minLength: 3,
      detail: Math.pow(3, (50 - detailV) / 50),
      stroke: t.inkColor,
      strokeWidth: Math.max(0.1, t.avgStrokeWidth * (outW / t.width) * thickness),
      matchWeights: true,
      avgWidth: t.avgStrokeWidth,
      ink: t.ink,
      outW, outH
    });
    state.svg = svg;
    if (state.lastBlobUrl) URL.revokeObjectURL(state.lastBlobUrl);
    state.lastBlobUrl = URL.createObjectURL(new Blob([svg], { type: 'image/svg+xml' }));
    if (!$('binView').checked) traceImg.src = state.lastBlobUrl;
    else showBinarized();
    const modeNames = { dark: 'dark lines', light: 'light lines', alpha: 'transparency' };
    const prepNames = { blur: 'denoised', sharp: 'sharpened', adaptive: 'lighting corrected' };
    setStatus(
      `${pathCount} lines · ${pointCount} anchors · ${weights.length} weight${weights.length > 1 ? 's' : ''}` +
      (traceMs ? ` · ${Math.round(traceMs)} ms` : '') +
      ` · <span class="mode">${modeNames[t.mode]}${prepNames[t.preprocess] ? ' · ' + prepNames[t.preprocess] : ''}</span>`
    );
    const notes = (t.warnings || []).slice();
    if (dropped) notes.push(`Very busy image: kept the ${PATH_CAP} longest lines (${dropped} tiny fragments dropped).`);
    else if (pathCount > PATH_WARN) notes.push(`${pathCount} paths — Figma may get slow. Raising Detail simplification or cropping the image helps.`);
    warn.textContent = notes.join(' ');
    warn.classList.toggle('visible', notes.length > 0);
    $('importBtn').disabled = pathCount === 0;
    $('copyBtn').disabled = pathCount === 0;
    syncHeight();
  }

  // binarized intermediate view — "what did the tracer actually see?"
  function showBinarized() {
    const t = state.traced;
    if (!t) return;
    if (!state.binUrl) {
      const canvas = document.createElement('canvas');
      canvas.width = t.width; canvas.height = t.height;
      const ctx = canvas.getContext('2d');
      const id = ctx.createImageData(t.width, t.height);
      for (let i = 0; i < t.ink.length; i++) {
        const v = t.ink[i] ? 0 : 255;
        id.data[i * 4] = id.data[i * 4 + 1] = id.data[i * 4 + 2] = v;
        id.data[i * 4 + 3] = 255;
      }
      ctx.putImageData(id, 0, 0);
      state.binUrl = canvas.toDataURL('image/png');
    }
    traceImg.src = state.binUrl;
  }

  function setStatus(html, isError) {
    status.innerHTML = html;
    status.style.color = isError ? '#f24822' : '';
  }

  // ---------- controls ----------
  // cheap controls: re-render only (no re-trace)
  $('thickness').addEventListener('input', () => {
    $('thicknessOut').textContent = $('thickness').value + '%';
    render();
  });
  $('detail').addEventListener('input', () => {
    const v = +$('detail').value;
    $('detailOut').textContent = v === 50 ? 'auto' : (v > 50 ? '+' : '') + (v - 50);
    render();
  });
  $('binView').addEventListener('change', () => {
    if ($('binView').checked) showBinarized();
    else if (state.lastBlobUrl) traceImg.src = state.lastBlobUrl;
  });

  // raster controls: re-trace (debounced — sliders fire while dragging)
  let retraceTimer = 0;
  const queueRetrace = () => {
    clearTimeout(retraceTimer);
    retraceTimer = setTimeout(retrace, 300);
  };
  $('thrOff').addEventListener('input', () => {
    const v = +$('thrOff').value;
    $('thrOffOut').textContent = v === 0 ? 'auto' : (v > 0 ? '+' : '') + v;
    queueRetrace();
  });
  $('bridge').addEventListener('input', () => {
    const v = +$('bridge').value;
    $('bridgeOut').textContent = v === 0 ? 'off' : v === 55 ? 'auto' : v + '%';
    queueRetrace();
  });
  $('sharpen').addEventListener('input', () => {
    state.autoSharpen = false;
    const v = +$('sharpen').value;
    $('sharpenOut').textContent = v === 0 ? 'off' : v + '%';
    queueRetrace();
  });
  $('invert').addEventListener('change', queueRetrace);

  $('importBtn').onclick = () => {
    if (!state.svg) return;
    parent.postMessage({ pluginMessage: { type: 'import-svg', svg: state.svg, name: state.name } }, '*');
  };

  $('copyBtn').onclick = async () => {
    if (!state.svg) return;
    try {
      await navigator.clipboard.writeText(state.svg);
      setStatus('SVG copied to clipboard.');
    } catch (_) {
      const ta = document.createElement('textarea');
      ta.value = state.svg;
      document.body.appendChild(ta);
      ta.select();
      const ok = document.execCommand('copy');
      ta.remove();
      setStatus(ok ? 'SVG copied to clipboard.' : 'Copy failed — use Add to canvas instead.', !ok);
    }
  };
})();
</script>
